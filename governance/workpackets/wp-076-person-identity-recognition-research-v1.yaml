base_scope:
  - "Deliver governance/research_person_identity.md: a current, source-cited research basis and design proposal for (1) engine-quality upgrades usable by other models and (2) a People system - named identities, browse-all-photos-with-person, person: search chip, People collection view."
  - "Evaluate recognition-model candidates beyond ArcFace w600k strictly under tract op coverage and the determinism/reproducibility contract from research_face_identity.md; label anything unverifiable as UNVERIFIED."
  - "Design the People data model on the proven seams: persons catalog + assignments mirroring the WP-061 stable-ID catalog pattern in media.redb, a separate regenerable face_index.redb mirroring clip_index.redb with per-row dim and multi-face rows, canonical_key worker keying, counted transactions, own write path so no person operation can touch a label vector."
  - "Design incremental clustering with operator-named assignments contractually preserved across re-clusters (Immich-pattern), explicit merge/split flows, and stated determinism trade-offs."
  - "Size throughput honestly for kpop-scale batches on this workstation's CPU against the real 146k-row folder; state the warm-daemon (STUB-K) and GPU (STUB-L) dependencies if CPU-only indexing is not honest."
  - "Produce promotable follow-up work-packet stubs (engine crop-embed entry point + dim validation; face index + clustering; People UI + naming/merge; person: chip + collection view) appended to the backlog with dependencies."
high_roi_additions:
  - "Naming the engine gaps now (crop-level embed entry point, embedding-dim validation, silent cosine truncation) turns them into cheap engine hardening stubs even if People work is deferred."
  - "The non-interference proof section gives the operator a durable guarantee the tag system stays untouched before any code exists."
  - "XMP face-region interop (digiKam/PhotoPrism convention) evaluated as an import/export option makes scraped-batch triage portable across tools."
reuse:
