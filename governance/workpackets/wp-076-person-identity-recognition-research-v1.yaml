  - "No sizing exists for identity indexing at the operator's real media scale."
acceptance_criteria:
  - "governance/research_person_identity.md exists in the mandated prose format with sources checked, patterns found, reuse opportunities, rejected options, selected approach, risks, mitigations, and validation plan - explicit enough for a no-context model."
  - "Every recommended model or technique is verified against tract op coverage and the determinism contract, or labeled UNVERIFIED."
  - "The People design maps every component onto cited existing code seams with a non-interference section covering tables, write paths, and search chips."
  - "Incremental clustering design preserves operator-named assignments across re-clusters by contract."
  - "Throughput sizing is stated with measured or clearly-derived numbers for this workstation, at kpop-batch scale."
  - "Follow-up stubs exist in the backlog, individually promotable, with dependencies."
  - "No product code ships from this packet beyond throwaway measurement probes."
