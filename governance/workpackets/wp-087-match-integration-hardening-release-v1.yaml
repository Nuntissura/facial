benchmark_contract:
  schema_version: 1
  canonical_artifact: governance/validation/wp-087-match-benchmark-v1.yaml
  build:
    cargo_profile: release
    measured_runtime: version-matched packaged portable executable
    required_identity: [git_commit, app_version, Cargo.lock_sha256, model_generation, schema_generation]
  reference_hardware_manifest:
    required_fields: [cpu_model, physical_cores, logical_cores, ram_bytes, gpu_model, gpu_driver, inference_backend, os_edition, os_build, power_mode, storage_kind, media_root_kind, network_link]
  display_profile:
    viewport_physical_px: [1920, 1080]
    dpi_scale_percent: 100
    egui_pixels_per_point: 1.0
    font_family: Inter
    font_size_pt: 19
  sampling:
    render_warmup_seconds: 30
    render_measure_seconds: 120
    render_min_samples_per_state: 7200
    render_window_ms: 2000
    render_window_cadence_ms: 250
    render_window_min_samples: 60
    render_window_insufficient_samples: fail_run
    render_sample_record: [frame_end_timestamp_us, frame_duration_us]
    render_window_interval: half_open_on_frame_end_timestamp
    render_required_window_starts: measurement_start_us_plus_k_times_cadence_for_all_nonnegative_k_where_start_plus_window_ms_lte_measurement_end_us
    interaction_warmup_calls: 20
    interaction_measured_calls: 200
    concurrency_warmup_seconds: 60
    concurrency_measure_seconds: 600
  percentile_method:
    clock: monotonic_wall_clock_microseconds
    estimator: nearest_rank_sorted_raw_samples
    index_formula: ceil_p_times_n_then_minus_1_zero_based
    trimming: forbidden
    required_outputs: [measurement_start_us, measurement_end_us, sample_count, p50_us, p95_us, p99_us, max_us, raw_sample_records_sha256, window_ms, window_cadence_ms, window_min_samples, required_window_count, evaluated_window_count, worst_window_p50_us, worst_window_p95_us, worst_window_p99_us, worst_window_max_us, worst_window_start_us, worst_window_end_us, rolling_verdict]
  comparability:
    render_ab_order: [match_disabled, active_quiet, active_quiet, match_disabled]
    invariant_fields: [packaged_binary, hardware_manifest, display_profile, fixture_generation, cache_state, input_script, power_mode]
    invalid_if_invariant_differs: true
    match_disabled_definition: feature_unavailable_or_unconfigured_with_zero_Match_worker_model_or_index_query_admission
    match_disabled_is_operator_paused: false
  workloads: [match_disabled, active_quiet, typical_face_edit, pathological_1000_face_edit, match_people_10000_open, settings_manage_people_route, autocomplete, pause_and_hold, concurrent_indexing_and_playback, resource_governor_saturation, media_multilabel_predecessor]
  resource_governor:
    required_ceiling_fields: [admitted_items, aggregate_queue_items, aggregate_queue_bytes, cpu_inference_concurrency, decoded_image_bytes, gpu_vram_bytes_if_enabled, surrealdb_write_concurrency, vector_index_build_concurrency]
    simultaneous_pressure: [remote_filesystem, face_detection_and_inference, decoded_images_and_crops, gpu_if_enabled, surrealdb_writes, vector_index_build, inter_stage_queues, visible_thumbnails, viewer_playback]
    required_outputs: [configured_ceilings, observed_peaks, backpressure_events, terminal_lease_balance, thumbnail_budget_verdict, playback_budget_verdict, navigation_budget_verdict]
    pass_condition: no_ceiling_exceeded_no_lease_leak_and_existing_visible_work_budgets_pass
  gates:
    normal_and_typical_edit_worst_window_frame_p95_ms: 16.7
    worst_window_frame_p99_ms: 33.3
    pathological_1000_face_worst_window_frame_p95_ms: 33.3
    pause_and_route_feedback_p95_ms: 100
    autocomplete_p95_ms: 100
    autocomplete_max_ms: 200
    match_people_10000_open_p95_ms: 200
    new_stage_admission_cutoff_ms: 250
    inflight_safe_unit_hard_limit_ms: 2000
