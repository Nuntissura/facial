research_basis:
  sources_checked:
    - "Field model session notes (2026-06-11): positional-tile inference failure, chat-tracked
       decisions, rejects.txt, 450-image serial bottleneck - the exact failure modes to remove"
    - "Existing product surfaces re-read: api.rs command/receipt protocol (atomic rename,
       action_id receipts), identity gate batch manifest (WP-007), sort_run copy semantics"
    - "kohya-ss dataset conventions (training dir layout: <repeats>_<name>/ images;
       captions sit beside images as .txt; config via TOML) - export must match what the
       trainer consumes without facial owning training"
  patterns_found:
    - Claim-by-rename is already this app's concurrency primitive (commands/ -> processing/);
      shard claiming reuses it (claims/ dir, one JSON per shard, atomic rename to claim).
    - Append-only JSONL ledger + derived manifest snapshot = queryable lineage without a DB
      (STUB-M direction; consistent with events.jsonl).
  reuse:
    - Stable image IDs: sha256 already computed by facet diagnostics + deepface represent;
      reuse the same hashing (first 16 hex chars as short ID, full hash stored).
    - Montage: image crate (already a dependency) composes tiles; identity gate face_box
      provides optional face-crop tiles.
    - Export copy semantics mirror sort_run (non-destructive copy, manifest stamped).
  rejected_options:
    - SQLite store (new native dependency; JSONL ledger + manifest snapshot is sufficient
      and diff-able; revisit only if query volume demands it)
    - Positional tile indexes in montages (the exact field failure; tile IDs are image IDs)
    - In-place decision mutation of one manifest file (corruption risk under parallel
      agents; append-only ledger wins)
selected_approach:
  - "Session store at <output_root>/review/<session_id>/: session.json (immutable init
    metadata: source, filters, shard plan), ledger.jsonl (append-only events: init,
    claim, decide, release, export), manifest.json (derived snapshot: per-image row =
    id, path, sha256, source-run fields if present, shard, decision, reason, actor, ts),
    montages/ (montage_<shard>_<page>.png + .map.json tile->image-id maps)."
  - "Image identity: sha256 of file bytes; short_id = first 16 hex. Collisions on short_id
    fall back to full hash in all verbs."
  - "Command kinds (backend, receipts as usual): review_init (--dir | --run-id | --csv,
    optional --shards N), review_claim (--session S [--shard K] --actor A; atomic
    claim-by-rename), review_decide (--session S --id ID --decision accept|reject|hold
    --reason TEXT --actor A; appends to ledger), review_status (--session S; counts per
    decision/shard/actor), review_montage (--session S --shard K [--page N] [--face-crop];
    writes montage + map), review_export (--session S --format kohya --out DIR
    [--repeats N] [--name NAME]; copies accepted images into <repeats>_<name>/, writes
    dataset manifest + funnel summary; refuses if undecided images remain unless --allow-partial)."
  - "Lineage: every verb appends a ledger event with exact invocation args; review_status
    and the export manifest render the funnel (source -> candidates -> decided ->
    exported) with counts + reasons; schema_version stamped everywhere."
  - "Slices: (1) store + init/decide/status + tests; (2) claim/shards + montage+map;
    (3) export kohya + funnel manifest; (4) MANUAL/spec/topology sync. GUI tab = future packet."
risks:
  - risk: Parallel agents double-claim a shard.
    mitigation: claim = atomic file rename (same primitive as the command queue); claimed
      shard files carry actor + ts; re-claim of a claimed shard is rejected in the receipt.
  - risk: Ledger grows unbounded / manifest drifts from ledger.
    mitigation: manifest is always re-derivable (replay); review_status replays on demand;
      ledger events are small JSON lines.
  - risk: Montage pages for 450+ images blow memory.
    mitigation: fixed tile size (256px) + paged montages (default 5x6 tiles/page), stream
      one tile at a time.
  - risk: Export with undecided images silently drops them.
    mitigation: refuse unless --allow-partial; funnel summary always states undecided count.
red_team:
  - scenario: Two agents decide the same image differently.
    control: last-write-wins by ledger order BUT both events retained; review_status flags
      conflicting decisions (decision_conflicts list) for operator adjudication.
  - scenario: Source folder mutates mid-session (files deleted/renamed).
    control: rows carry sha256 + original path; export verifies hash before copy and
      reports missing/changed files explicitly rather than copying wrong bytes.
  - scenario: A crashed agent leaves a shard claimed forever.
    control: review_claim --steal flag requires explicit actor + reason, logged to ledger;
      status shows claim age.
  - scenario: kohya layout assumptions rot.
    control: export layout covered by a unit test; manifest records layout version.
acceptance_criteria:
  - "review_init over the WP-007 gate CSV or a folder creates a session with stable IDs."
  - "review_decide appends to the ledger and is visible in review_status counts."
  - "Two actors claiming shards cannot overlap; conflicting decisions are surfaced, not lost."
  - "review_montage emits a PNG + tile map keyed by image ID (no positional inference)."
  - "review_export --format kohya produces <repeats>_<name>/ images + manifest + funnel
     summary; undecided images block export unless --allow-partial."
  - "All verbs run headless via the existing command/receipt protocol with exit codes."
  - "cargo test covers: ID stability, ledger replay, claim atomicity (thread test),
     conflict surfacing, kohya layout."
validation:
  - method: "cargo test --manifest-path product/Cargo.toml"
    expected: "new review tests pass"
  - method: "end-to-end smoke: init over a temp folder of test images -> decide all ->
             montage -> export; inspect receipts + funnel manifest"
    expected: "funnel counts consistent at every stage; export tree matches kohya layout"
notes:
