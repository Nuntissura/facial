workpacket_id: WP-065
taskboard_id: TB-FACIAL-WORKBENCH-001
title: Deterministic video surface placement authority - audio-only, cross-app flicker, and folder-switch playback loss
status: in_progress
owner: model
created_at: "2026-08-12"
updated_at: "2026-08-15"
progress:
  landed:
    - "A receipt-backed media_tabs set_split action changes the active tab's Library / Viewer ratio without native fullscreen, resize, focus, or activation. It rejects non-finite values, clamps finite values to 0.25..0.80, persists the applied ratio, and exposes per-tab view_mode/split_ratio plus active bounds in receipts."
    - "Play is deferred behind a visible reconciler claim. Receipts report preparing_surface with playing=false and command_count=0 before the decoder exists; VlcRuntime places current clipped owner geometry before libvlc_media_player_play."
    - "Cross-owner handoff pauses the existing player, retains the last physically placed owner in diagnostics, places the new owner, then resumes."
    - "hide() is authoritative against live IsWindowVisible instead of a cached flag, clears last_surface_bounds, and invalidates the vacated parent rectangle so a hidden child cannot leave its last frame on screen."
    - "show_clipped() intersects the requested rect with the owning panel's clip rect and hides on an empty intersection, so a scrolled or partially visible tile can no longer paint a full-size top-of-Z video window over the toolbar and Viewer."
    - "Both render call sites pass their panel clip rect."
    - "The reconciler retains defensive arbitration for old Library state, but the reachable product has one Viewer owner: Library tile Play routes to Viewer and play_library rejects before decoding or lease acquisition."
    - "Folder change makes an explicit decision: playback whose file is not inside the incoming folder is stopped and its placement state cleared, instead of being silently orphaned."
    - "Both video obscured-checks now include the folder-navigator capture window and the Settings capture window."
    - "New trace phases vlc.show_at, vlc.hide, vlc.stop, vlc.clip, and ui.folder_change.stop_playback make the previously untraced placement lifecycle observable."
  verified:
    - "The new background-safe set_split route was live-proven during confirmed Viewer playback at both boundaries. At 0.25 the later status receipt reported target/clipped/live bounds [972,191,2855,1625]; at 0.80 it reported [3070,191,756,1625]. Both states retained the Viewer owner, advancing playback, matching LibVLC HWND identity, zero player failures, and native_fullscreen_changed=false."
    - "Directly inspected live snapshots split-025.png and split-080.png show the decoded picture confined to Viewer while the Library becomes narrow or wide as requested. Snapshot receipts 343f4dfe-11cc-429c-ae62-85848a5ccb55 and 5ef8c894-6575-4241-a232-4c10c3f97992 report foreground_activation=false and successful LibVLC composition."
    - "set_split accepted 0.25 and 0.80, rejected NaN without changing the retained 0.80 state, and exposed the applied per-tab ratio in subsequent receipts. Stop then cleared the child and playback lease."
    - "Fresh background Viewer Play began as preparing_surface with no decoder command, then reached confirmed playback with advancing time, one visible child, matching LibVLC HWND, and target/clipped/live bounds [2383,191,1443,1625]."
    - "Exact mapped-folder Viewer playback survived the complete 146,634-row Created sweep, repeated receipt-backed grid navigation, and seeks with zero player failures; all stat rows and 4,583 background slices settled and released."
    - "The background-safe ui_snapshot directly inspected on 2026-08-15 shows decoded picture only in Viewer, a usable full Library grid, and no stale video bleed. Its receipt reports foreground_activation=false and successful LibVLC composition."
    - "Stop cleared the visible child, target/clipped bounds, playback lease, and every active or queued I/O class; the exact 146,634-row inventory remained settled with zero stat failures."
    - "play_library rejects with the measured-gate reason and zero playback leases. The headless inspector now calls the same gate and asserts that no Library host or native-surface claim can be manufactured."
    - "Historical pre-remediation Library/Viewer handoff, clipping, folder-switch, and hide traces remain diagnostic evidence for the retained reconciler, not acceptance evidence for a currently reachable Library playback route."
  outstanding:
    - "Exact mapped-drive fullscreen round trip remains unverified because it would foreground or resize the native application while the operator is using the machine."
    - "Runtime shell-dialog ownership remains unverified because opening the real chooser would create a foreground OS window."
    - "The complete Media ui-inspect run currently stops before the WP-065 fallback assertion because the pre-existing 50k multi-label A/B gate reproducibly fails: candidate p95 was 1.959 ms versus 1.219 ms, then 1.820 ms versus 1.265 ms. The absolute 16.7 ms budget passes, but the relative <=10% gate does not. The focused shipping/debug fallback unit passes, and the generated media_video/media_grid PNGs were directly inspected as clean; the full inspector is not claimed as passing."
  mapped_root_verification_2026_08_14:
    - "HISTORICAL PRE-REMEDIATION: exact Z: testing exercised Library then Viewer and diagnosed the +13.9% Library-playback p95 failure that triggered WP-058's Viewer-only fallback."
  mapped_root_verification_2026_08_15:
    - "Current reachable acceptance on Z:\\Video\\4K Video\\4K Video 21-08-2025: Viewer playback advanced with matching target/clipped/live bounds, valid parent/child and LibVLC HWND identity, and zero player failures while 146,634 rows settled."
    - "Live set_split proof on the same mapped folder retained confirmed Viewer playback at both 0.25 and 0.80 with matching target/clipped/live child bounds and background-only snapshots."
