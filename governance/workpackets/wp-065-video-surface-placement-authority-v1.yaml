  - method: "facial-cli ui_snapshot at every transition, with direct inspection of the composited PNG and the -video.png sidecar"
    expected: "The picture is present in Viewer and absent everywhere else; capture never reports bounds drift."
  - method: "facial-cli ui-inspect media video presets"
    expected: "Affected PNG and layout JSON are directly inspected and consistent with the live snapshots."
  - method: "operator-media acceptance on the exact available mapped folder"
    expected: "Viewer placement, folder change, tab change, and fullscreen round trip each keep or correctly release the picture; play_library remains rejected."
  - method: "high-risk adversarial review"
    expected: "No unresolved placement, Win32 clipping and invalidation, deferred-play, or capture-path findings remain."

single_reconciler:
  defect: "The Library tile and the Viewer panel each called show_clipped/hide directly while painting. Whichever painted last won, so one frame could move the native child, hide it, then move it again -- the operator's 'flickers the last played video all over the screen', and playback that only worked after a fullscreen round trip."
  change: "Draw sites only record a placement claim (owner, media, lane, clipped rect, ppp). FacialApp::reconcile_video_surface runs once at the end of render_ui and applies exactly one decision. Viewer is the only reachable claimant under the measured fallback; defensive Library arbitration remains for state safety. No claim means hide."
  structural_guard: "ui::tests::only_the_reconciler_moves_the_native_video_surface counts placement and hide call sites in the product source and requires exactly one of each. The guard is structural because without LibVLC loaded there is no child window to place, so a headless behavioural test never reaches the call. The defect class -- a newly added draw site poking the window directly -- is exactly what the count catches."
library_fallback_gate:
  what: "The headless ui-inspect media stage requests inline Library playback through the same require_inline_library_playback gate as the shipping action."
  asserted:
    - "The request rejects with the measured exact-NAS gate reason and points to Viewer playback."
    - "No media_inline_video_path is created."
    - "After rendering, no Library native-surface claim exists."
  reason: "The previous inspector hook wrote media_inline_video_path directly and therefore proved an unreachable state after WP-058 disabled Library decoding."
shell_dialog_owner:
  defect: "The Windows 'Open with' chooser was owned by GetActiveWindow(), which returns the calling THREAD's active window and is null whenever no window of that thread is active. A null owner leaves the modal ownerless: it can open behind the app or on the wrong monitor."
  change: "open_with_dialog now takes an owner and the call sites pass VideoPlayer::parent_window_handle -- the handle eframe supplied. It is re-validated with IsWindow because a handle can go stale across viewport recreation, with GetActiveWindow retained only as a last resort."
  status: "UNVERIFIED at runtime: confirming an ownerless-versus-owned modal requires opening the real shell dialog, which would pop a foreground window. The change is source-level and the previous behaviour is documented Win32 semantics."
