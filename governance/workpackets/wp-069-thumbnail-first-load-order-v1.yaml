progress:
  landed:
    - "Each Media load generation now records time-to-first-row, first actually painted thumbnail texture, first scrollable layout, and settled order; a bounded history keeps the last 16 generation/lane records."
    - "Media-only frame diagnostics now expose a rolling two-second p50/p95/max window beside the explicitly session-cumulative maximum, so a stale historic spike cannot be mistaken for current scroll performance."
    - "Stat-sort settlement is generation-exact: content identity, unique stat request, completed sidecar, displayed stat generation, sort direction, query, mode, and scope must all match."
    - "A stat-dependent sort keeps rows usable and shows `ordering by <key>… current rows remain usable` until the exact display generation settles."
    - "Every ScanCacheReady and ScanDone publication now publishes an immediately renderable display order regardless of query or sort key; previously only the empty-query/Name-sort case did."
    - "ScanBatch appends every published batch to the display order, so the grid grows and stays scrollable during enumeration."
    - "start_compare_scan_internal no longer blanks a published order when a cached inventory is being reconciled."
    - "The canonical tile key is cached per path instead of being recomputed and allocated for every visible tile every frame, with a bounded cache."
  verified:
    - "Focused tests prove first-observation timing, bounded history/frame windows, percentile calculation, stat-settlement truth states, and stale identical-content completion rejection."
    - "Full Media ui-inspect passed; the directly inspected media_sort_pending PNG/layout shows visible rows, Created ascending, and an unclipped ordering notice."
    - "cargo test: 244 passed, 2 ignored, 0 failed."
    - "cargo test: full suite green."
    - "Collection tabs publish rows and order in the same frame with no scan."
  outstanding:
    - "Comparable before/after time-to-first-painted-thumbnail and time-to-scrollable on the operator's local folder and canonical mapped-drive folder; current-source exact measurements exist, but no uncontaminated prior-build pair exists."
    - "Receipt-backed rolling p95 frame-time capture during an operator-equivalent live scroll compared with the prior build. Current-source mixed Created-sort navigation reached 4,490 us worst rolling p95, but the comparison half remains open."
    - "Baseline audit: the clean pre-WP-069 commit is 5ca464a7c7df53af94298a26ddc72391e856aaed, but that source does not emit first_thumbnail_visible_ms, scrollable_frame_ms, rolling p95, navigate_grid, or set_sort. Adding those probes would alter the baseline being compared, so the required pair cannot be produced honestly without an operator-approved acceptance change or a historical binary that already exposes equivalent metrics."
  verification_2026_08_14:
    - "Exact current-source Z: load recorded first row 180 ms, first painted thumbnail 746 ms, first scrollable frame 181 ms, settled order 22,046 ms, 146,634 final rows, and no terminal blanking."
    - "Created-order metadata work completed for all 146,634 rows while receipt-backed navigation remained active; display_count never dropped below 146,634."
