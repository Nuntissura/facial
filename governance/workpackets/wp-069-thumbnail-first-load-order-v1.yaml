workpacket_id: WP-069
taskboard_id: TB-FACIAL-WORKBENCH-001
title: Thumbnail-first layered load order and large-folder first-paint performance
status: in_progress
owner: model
created_at: "2026-08-12"
updated_at: "2026-08-12"
refinement: governance/refinements/wp-069-thumbnail-first-load-order-v1.md
dependencies: [WP-043, WP-050, WP-055, WP-056, WP-057, WP-064, WP-068]
scope:
  - product/src/ui.rs
  - product/src/media_explorer.rs
  - product/src/media_thumbs.rs
  - product/src/media_io.rs
  - product/src/media_search.rs
  - product/src/ui_inspect.rs
  - product/src/api.rs
  - product/docs/MANUAL.md
  - specs/app-spec.md
