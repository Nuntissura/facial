acceptance_criteria:
  - "Every documented command, intent, path, shortcut, and receipt field is executed or inspected against the built binary before being written; no unverified statement is written."
  - "No contradictory statement about a changed surface remains anywhere in the Manual or the specification."
  - "Every documented shortcut matches the actual bindings and action vocabulary."
  - "Every documented facial-cli example runs, including at least one failure case with its real output shape."
  - "The Manual tab still renders correctly: contents tree, heading hierarchy, and scrolling verified by inspection."
  - "A fresh-context model, using only the Manual, can open a folder in a new tab, recover a stuck modal, play in Library and Viewer placement, search with a subtractive filter in folder-only scope, open the favorites collection tab, and sort by created descending."
  - "Any gap found by that no-context check is closed by adding the missing intent, diagnostic, or inspector fixture, not merely by describing it."
  - "Every topology claim names its enforcement or is phrased as intent."
  - "Font support is documented honestly: monochrome emoji only, optional system-font dependency, and any Thai shaping limitation."
  - "Manual, specification, topology, CODEX.md, README.md, taskboard, and the WP-064..WP-070 packet statuses all agree."
risks:
  - scenario: "The Manual documents intended rather than shipped behaviour."
    mitigation: "This packet runs last, against shipped code, and every claim is executed or inspected before being written."
  - scenario: "Contradictions survive in older specification sections."
    mitigation: "Search for each superseded claim and correct every occurrence, not just the newest section."
  - scenario: "Manual in-app navigation breaks after the edit."
    mitigation: "Run the Manual tab through ui-inspect and confirm the contents tree, headings, and scrolling."
  - scenario: "A no-context model still cannot operate a changed surface."
    mitigation: "Treat it as a missing tooling gap per FACIAL-MODEL-003 and add the intent, diagnostic, and fixture in this packet."
  - scenario: "Documentation work is treated as progress while product defects remain."
    mitigation: "This packet cannot start until WP-064 through WP-070 are implemented and verified."
