verification_round_2:
  - "Every documented keyboard shortcut cross-checked against media_input.rs defaults. Two defects found: the Manual claimed Ctrl+O opens a file (OpenFile is bound to Enter only) and Ctrl+K focus-search was bound but undocumented. Both corrected."
  - "Documented CLI examples executed against the built binary: get_state, media_meta_list, media_labels_list, media_fav_list, thumbs_gc, list_features, list_lanes and controller-probe all exit 0 with status ok; the negative path (media_meta_get without --path) exits 1 with a clear message."
  - "Manual updated for the new set_scope/set_sort/open_collection intents, display provenance, the measured font cost and FACIAL_SYSTEM_FONTS opt-out."
audit_findings_round_3:
  method: "Ran this packet's own acceptance: a fresh-context agent permitted to read ONLY product/docs/MANUAL.md attempted seven workflows against the running app. Two were not completable and four Manual statements proved false."
  behaviour_defects_found_and_fixed:
    - "media_set_folder reported 'applied ... scanning' on the Favorites collection tab while doing nothing. Now refused with the two ways forward named."
    - "set_sort reported success and changed nothing on a collection tab. Stat keys refused there with the reason; name accepted, applied to the tab record, and re-applied to published rows including direction."
    - "media_search receipts lagged by exactly one intent: counts were computed in the apply frame before the asynchronous ranker re-ran, so a model reading the receipt of the command it just issued always got the previous query's numbers. Counts are now emitted only when they belong to the current query, with counts_settled; otherwise null."
    - "Mutation receipts embedded the pre-change tab array, making a stale-but-succeeded receipt indistinguishable from an accurate-but-failed one. Viewports are snapshotted before the payload is built."
    - "No read-only route existed to list labels while the GUI held the exclusive media-db lock, so discovering a label ID required mutating the catalog. Added media_tabs --action labels."
    - "open_collection's labels:LABEL_ID form was absent from the Manual and from the intent's own rejection text."
    - "scan_unchanged/inventory_unchanged were only inside a free-text note; now structured as last_scope_change."
  documentation_defects_found_and_fixed:
    - "Manual claimed display_count/display_provenance are per-tab; they are top-level for the active tab."
    - "Manual claimed media_label_mutation --label accepts ID_OR_NAME; update and delete require the ID."
  tooling_defect_found_and_fixed:
    - "The 50k label-paint guard compared sub-millisecond frames, so microseconds of jitter read as double-digit percentages and it fired inconsistently on unchanged builds. It now requires both a percentage breach and a 250us absolute difference."
  outstanding:
    - "Undocumented flags are still silently swallowed by the CLI builder (an unused --label on media_tabs is accepted and dropped)."
audit_round_4_confirmation:
  method: "Re-ran the Manual-only audit against a FRESH workspace with a fresh-context agent after the round-3 fixes."
  result:
    - "Zero Manual statements proved false (was four)."
    - "Zero commands reported success while doing nothing (was two)."
    - "All seven workflows completed (was five of seven)."
    - "The auditor independently corroborated the scope proof two ways: the structured last_scope_change fields, and a before/after capture showing scan_generation 8->8, inventory_generation 2->2, display_count 5->5 while search_folder_only flipped False->True."
    - "The auditor obtained a trustworthy search count by following the Manual's async instruction: counts_settled=false -> poll until display_provenance=settled -> display_count=4, cross-checked by re-issuing the query (counts_settled=true, matched=4, excluded=1) and by the inverse query (1), summing to the 5 files on disk."
  further_gaps_found_and_closed:
    - "media_tabs receipts now carry a structured label_catalog array; the catalog had been available only inside free-text prose, so the auditor had to regex a 32-hex ID out of a sentence."
    - "media_search receipts had still emitted query_diagnostics.matched_rows and search_status from the PREVIOUS query beside a correct applied status; both are now withheld until they describe the current query."
    - "The Manual listed eight media_tabs actions but explained three; open/select/close flag semantics had to be inferred, and the documented alternative (media_folder_navigate --action open_new_tab) has no --path. All action flags are now documented."
    - "The harmless first-scan inventory_error in a brand-new workspace is now documented under failure modes, including what a persistent occurrence means."
  manual_render_check:
    - "Manual tab re-rendered through ui-inspect after the edits: contents tree, heading hierarchy and body render correctly with no overflow."
