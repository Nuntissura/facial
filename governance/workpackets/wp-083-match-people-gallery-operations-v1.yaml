base_scope:
  - "Add Match as the feature/navigation name with People, Suggestions, and Unidentified subviews."
  - "Provide opt-in indexing roots and exclusions, explicit start, pause, resume, cancel, retry, progress, failed-file details, partial results, and strict-matching status."
  - "Provide stable person creation, naming, renaming, aliases, cover selection, hiding, favorite state, counts, and scan-free person galleries."
  - "Build collection rows from the in-memory Match projection and existing Media collection viewport without copying media or starting filesystem scans."
  - "Keep active Match silent during ordinary Media browsing: selecting media, opening folders, and receiving suggestions never opens Match, shows a modal or Viewer suggestion, requests text focus, raises the app, or starts analysis."
  - "Add Settings -> Match for analysis state, roots/exclusions, pause/resume, failures, and a Manage people route into Match -> People; Settings must not duplicate the People gallery or catalog manager."
  - "Own the synthetic 10,000-People fixture and its open-time budget in the virtualized Match -> People manager. Settings -> Match renders no People rows, counts, covers, or catalog projection; its Manage people control only acknowledges the route and navigates to the canonical manager."
  - "Expose persisted operator pause separately from transient execution inhibitors supplied by WP-081; pause stops automatic work while cached galleries and explicit manual operations remain usable."
  - "Expose every catalog and job operation through receipt-backed intents, state snapshots, diagnostics, and deterministic inspector fixtures."
  - "Keep model/runtime settings out of the normal Match UI."
non_goals:
  - "No manual face boxes, merge/split, reassignment, search chip, video tracking, or context inference."
acceptance_criteria:
  - "Match displays People, Suggestions, and Unidentified with clear counts, cover thumbnails, partial-index state, and no false claim that indexing is complete."
  - "A named person opens a dynamic gallery across indexed roots without copying or relocating any media."
  - "Opening or navigating Match never implicitly starts a full-library scan."
  - "Ordinary Media navigation remains prompt-free and focus-safe; suggestions accumulate only in Match -> Suggestions and never appear as committed assignments in the Viewer."
  - "Settings -> Match controls one canonical execution snapshot that exposes desired mode, named transient holds, and job lifecycle separately, and routes People administration to Match -> People without maintaining a second catalog projection."
  - "The synthetic 10,000-People fixture opens only in virtualized Match -> People within 200 ms p95 under the WP-087 benchmark protocol and never loads or renders the complete catalog per frame."
  - "Settings -> Match contains processing controls plus Manage people, materializes zero People rows, and makes the route action visibly acknowledged within 100 ms p95 before Match -> People owns the destination open."
  - "Operator pause survives restart; Resume changes only desired_mode from operator_paused to running, removes no transient hold, cannot revive terminal or failed work, and leaves a per-asset Analyze request queued until the complete admission predicate becomes true."
  - "Index jobs remain controllable and inspectable after app restart, and failed/skipped assets retain actionable reasons and retry controls."
  - "All catalog and job actions work while the GUI owns the database and produce honest receipts describing post-command state."
  - "Every automatic discovery success, failure, or positive-resolution transaction consumes a single-use store-session/job/media-bound permit with nonzero item/byte/write accounting, serialized-payload authorization, Pausing-compatible in-flight settlement, and zero residual governor usage."
  - "Every directory-iterator advance, metadata probe, and owned source snapshot is lifecycle-admitted under the shared background filesystem ceiling; its single-use observation acquires a writer only after I/O and may settle during Pausing while no new filesystem work starts."
  - "Asset processing performs no pre-admission pathname stat; exact owned snapshot bytes determine size accounting under a zero-writer snapshot lease."
  - "Owned snapshot bytes retain continuous governor authority through exact-byte resize and atomic Detect transfer; resource-pressure retry cannot release or double-count that authority."
  - "Person gallery and cover source resolution explicitly use migration-backed media-key-leading indexes under unrelated historical job-asset load; media rekey atomically preserves gallery and persisted cover selection across restart."
  - "Sensitive capture markers are allocation-bounded before parse, bound their string fields, and retire superseded video sidecars while a valid transition marker still owns every surviving artifact."
  - "A complete pending sensitive-capture generation is recovered before current and pending_complete receipts verify the exact expected pending version, including identical-framebuffer/different-sidecar transitions."
  - "An incomplete first sensitive-capture transition is restart-recoverable only when its exact app-created marker is unchanged, the framebuffer path is absent, and each pending sidecar is absent or hash-matching; any existing framebuffer preserves the full state, and artifact hashing rejects every Windows reparse point."
  - "Full and compact Match inspector fixtures show readable, discoverable, unclipped controls and visible important state."
validation:
  - method: "Focused catalog, collection-materialization, partial-results, restart, and intent/receipt tests"
    expected: "All operations are deterministic, scan-free where required, and honestly attributed."
  - method: "Ordinary Media navigation, background completion/failure, Settings routing, and operator-pause interaction fixtures"
    expected: "Match starts no work or prompt from navigation, steals no focus, keeps one People catalog, and preserves exact pause intent across restart."
  - method: "WP-087 benchmark protocol over the synthetic 10,000-People projection plus repeated Settings -> Match Manage people routing"
    expected: "Only Match -> People virtualizes People rows and opens within 200 ms p95; Settings materializes zero People rows and acknowledges the route within 100 ms p95."
  - method: "facial-cli ui-inspect for populated, empty, indexing, failed, compact, and large-person fixtures"
    expected: "Structured layout gates pass and every PNG is directly inspected."
  - method: "Live background-safe intent and ui_snapshot walkthrough"
    expected: "No foreground activation occurs and the exact live Match state is observable."
  - method: "Concurrent discovery-writer saturation, media rekey/reopen, high-cardinality query-plan, schema-v11 migration, oversized-marker, and sensitive A-to-B video overwrite regressions"
    expected: "Writer ceilings and RAII hold, cover/gallery identity survives rekey and restart, both source queries use their indexes, migration installs the index, marker reads stay bounded, and no detached sensitive sidecar survives a successful overwrite."
  - method: "Single-slot concurrent walk/stat admission plus Pausing settlement, and identical-framebuffer/different-sidecar double marker-failure regressions"
    expected: "Filesystem work never exceeds the shared ceiling, admitted results settle without holding a writer across I/O, pending remains authoritative, and receipts cannot certify the older generation."
  - method: "Near-ceiling snapshot accounting with saturated Detect/CPU capacity"
    expected: "A failed atomic transfer preserves the original snapshot lease and blocks a second near-ceiling snapshot until Detect transfer or release succeeds."
  - method: "First-sensitive-publication marker/sidecar/framebuffer failure-and-retry matrix plus abandoned-transition tamper and Windows reparse hashing regressions"
    expected: "Every proven pre-framebuffer failure is retryable without deleting mismatched data, any present restart framebuffer fails closed with full-state preservation, and reparse-backed artifacts never verify."
risks:
  - scenario: "The feature becomes an ML control panel instead of a simple gallery."
    mitigation: "Expose people, suggestions, progress, and corrections; keep models and thresholds in diagnostics only."
  - scenario: "A review inbox becomes endless annotation work."
    mitigation: "Prioritize high-value uncertain cases, support batch dismissal and never-ask-again, and impose no completion pressure."
  - scenario: "Active Match turns visual-first browsing into recurring identification prompts."
    mitigation: "Make review pull-only: no unsolicited Viewer overlays, dialogs, tab changes, focus requests, notifications, or suggestion badges; keep candidates in Match -> Suggestions."
  - scenario: "Settings and Match each grow a different People manager."
    mitigation: "Keep Match -> People canonical and make Settings -> Match a processing-policy surface with a route to that manager."
  - scenario: "Settings computes or paints the 10,000-People catalog before routing, making a lightweight control surface freeze."
    mitigation: "Forbid People rows, covers, counts, and catalog materialization in Settings; benchmark route feedback separately from the virtualized Match -> People destination open."
  - scenario: "Collection rendering performs database or filesystem work per frame."
    mitigation: "Use cached projections and counted-transaction guards matching existing Media collection contracts."
notes:
  - "Promotes the catalog, gallery, and operations portion of STUB-P3."
  - "People is the committed manual-or-strict-automatic assignment subview inside the product feature named Match; suggestions remain separate."
evidence:
  implementation: "Rust-native Match People/Suggestions/Unidentified navigation, scan-free bounded galleries and covers, explicit roots/job controls, durable partial/failure/retry state, pause-safe discovery, schema-v11 indexed source resolution, transactional rekey, continuous snapshot-to-Detect resource authority, and privacy-bound sensitive capture recovery are implemented."
  focused_validation: "Atomic near-ceiling snapshot transfer, production filesystem/Pausing admission, the ignored real 174 MB Match worker, sensitive capture 10/10, abandoned-initial cleanup, ambiguous-present framebuffer preservation, Windows non-symlink reparse rejection, and the WP-073 confirmed-delete structural guard passed on the final implementation."
  serial_validation: "The fresh 396-test serial run reached 389 passed, 1 failed, and 6 declared environment/opt-in ignored; the sole failure was the WP-073 source guard detecting two new privacy-cleanup spellings. Cleanup was centralized behind a fresh regular/non-reparse validation helper; that exact failed test then passed, and every affected privacy/recovery group passed after the fix."
  adversarial_validation: "Independent behavior/concurrency and security/privacy reviewers both returned PASS on the final post-fix tree after earlier filesystem-admission, snapshot-authority, first-publication recovery, ambiguous-framebuffer, and Windows-reparse findings were hardened."
  governance_validation: "cargo check --all-targets and cargo fmt --check passed; 94 governance YAML files parsed; git diff --check reported no whitespace errors."
  residual: "The symlink fixture reports unsupported on this Windows host because symlink privilege is absent; the genuine non-symlink reparse fixture executed and passed. Final packaged 10,000-People p95 benchmarking remains assigned to the WP-087 benchmark protocol."
