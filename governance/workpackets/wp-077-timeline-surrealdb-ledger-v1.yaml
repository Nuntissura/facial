base_scope:
  - "Add a second isolated SurrealDB domain beside the current redb media database; do not alter the live media schema or storage."
  - "Add a portable timeline-ledger CLI module that discovers a project anchor and owns all source captures, database writes, IDs, receipts, rejections, and projections."
  - "Expose bounded worker proposal commands only; workers cannot create ingestable JSON, receipts, database rows, canonical facts, or Obsidian notes."
  - "Use the ledger as the contract and migration proving ground for later moving the existing Facial database to SurrealDB."
high_roi_additions:
  - "Use SurrealQL schema migrations and logical export from the first domain so the later media-store migration has proven operational paths."
  - "Keep append-only timeline JSONL as an independently readable evidence export while SurrealDB is the ledger's operational source of truth."
  - "Generate app-owned rejection audits so worker correction is deterministic without preserving malformed worker-authored data."
reuse:
  - "Facial CLI, structured receipts, workspace discovery, and native Rust module layout."
  - "Existing redb media database remains untouched as the parallel-system migration baseline."
gaps_closed:
  - "No independent SurrealDB domain currently proves embedded migration, schema, export, recovery, and provider-neutral agent interaction."
  - "Timeline maintenance currently requires an orchestrator to interpret worker prose rather than app-validated evidence."
acceptance_criteria:
  - "The timeline ledger uses embedded file-backed SurrealDB in a separate project-local state path and never opens or mutates media.redb."
  - "A versioned SurrealQL schema and logical export/rebuild route exist before timeline records are accepted."
  - "The CLI dynamically discovers timeline-maintenance.yaml and never persists a shared absolute vault path."
  - "A worker can only submit bounded observations. The app fetches and hashes sources, allocates IDs, writes receipts, and rejects malformed input without any canonical write."
  - "Focused tests cover project relocation, malformed proposal rejection, duplicate source capture, migration replay, and export/import equivalence."
validation:
  - method: "cargo test --manifest-path product/Cargo.toml timeline_ledger"
    expected: "Focused deterministic ledger and SurrealDB tests pass."
  - method: "cargo test --manifest-path product/Cargo.toml"
    expected: "Complete Rust suite passes."
  - method: "facial-cli timeline-ledger doctor --project-root TARGET"
    expected: "Reports anchor, database health, schema version, and canonical projection health."
  - method: "governance/check-governance-yaml.ps1"
    expected: "All governance YAML parses."
risks:
  - scenario: "The new database alters or locks the active media database."
    mitigation: "Separate embedded SurrealDB path, namespace, module, schema, and tests; no media_db imports."
  - scenario: "A local database binary becomes a sole source of truth or sync-conflict hazard."
    mitigation: "Use SurrealDB logical SurrealQL export and append-only evidence projection; validate restore before promotion."
  - scenario: "An agent creates a malformed or fabricated ingestable record."
    mitigation: "No agent-authored document intake. The app accepts bounded parameters and creates every persistent artifact after source validation."
notes:
  - "This is Facial's first SurrealDB migration-primer domain. It is deliberately parallel to redb, not a media migration."
  - "The K-pop vault remains a disposable integration target; Facial retains the durable engine."
