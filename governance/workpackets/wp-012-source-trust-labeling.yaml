workpacket_id: WP-012
taskboard_id: TB-FACIAL-WORKBENCH-001
title: 'Trust labeling - stamp "source": "proxy" | "real" on face feature outputs'
status: done
owner: model
validation_results:
  - build: "cargo build -> Finished"
  - real_path: "identity_gate + identity_gate_dir: source=real (CSV source col + gate_row). real_deepface_feature (represent with engine): source=real."
  - proxy_path: "source=proxy stamped at every feature payload root (the `feature: feature_id` marker) across deepface, facet, python_ofiq, ediffiqa, imagededup; deepface detect/analyze also row-level."
  - runtime_verified:
    - "identity_gate_dir -> source=real"
    - "deepface:detect -> source=proxy"
    - "facet:quality_pass -> source=proxy"
    - "imagededup:hash_duplicates -> source=proxy (the pHash dedup the field model named)"
    - "ediffiqa:model_s -> source=proxy"
  - docs: "MANUAL.md: identity de-labeled from 'experimental' (TOC, topic summary, heading); app-spec.md §6.1 documents source convention."
  - note: "python-ofiq stamped via the identical payload marker (not separately run; same construct verified on 4 sibling plugins + build)."
created_at: 2026-06-10
updated_at: 2026-06-10
promotes: STUB-W  # governance/backlog_field_feedback.md
origin: >-
  Field model's strongest critique: proxy plugins (skin-color heuristics, perceptual hash)
  emit authoritative-looking fields (face_count, quality_band) a consumer cannot
  distinguish from the real YuNet+ArcFace path without reading source. Stamp every face/
  quality feature output with "source": "proxy" | "real" so downstream models trust-weight.
research_basis: >-
  Internal audit, not external research. Real path = IdentityEngine (YuNet detect + ArcFace
  embed via tract): identity_gate, identity_gate_dir, and deepface represent/verify/find
  when an engine is provisioned. Proxy path = common.rs skin/quality heuristics: deepface
  detect/analyze, facet, python-ofiq, ediffiqa, imagededup (pHash). Documented in
  specs/app-spec.md and MANUAL.md (the manual already flags these as proxies in prose).
scope:
  - product/src/service.rs            # gate rows + real_deepface_feature -> "source":"real"
  - product/src/plugins/deepface.rs   # detect/analyze rows -> "source":"proxy"; represent/verify/find -> per engine
  - product/src/plugins/facet.rs      # rows -> "source":"proxy"
  - product/src/plugins/python_ofiq.rs# rows -> "source":"proxy"
  - product/src/plugins/ediffiqa.rs   # rows -> "source":"proxy"
  - product/src/plugins/imagededup.rs # rows -> "source":"proxy"
  - specs/app-spec.md                 # document the source field convention
  - product/docs/MANUAL.md            # document source field; promote identity out of "experimental"
  - governance/taskboard.yaml
constraints:
  - "Additive field only; do not change existing values."
  - "source = real ONLY when the output came from the YuNet/ArcFace engine; everything heuristic = proxy."
  - "When deepface represent/verify/find runs without an engine (proxy distances), stamp proxy, not real."
non_goals:
  - "Replacing proxy plugins with real models (that is STUB-W's larger 'real backbone' option; this WP only labels)."
expected_behavior:
  - "Every face/quality feature JSON row carries source: proxy|real."
  - "identity_gate / identity_gate_dir rows: source=real. deepface detect/analyze: source=proxy."
acceptance_criteria:
  - "identity gate output (single + batch CSV/manifest) includes source=real."
  - "deepface detect/analyze + facet + ofiq + ediffiqa + imagededup rows include source=proxy."
  - "deepface represent/verify/find: source=real with an engine provisioned, else proxy."
  - "Build succeeds; a quick run shows the correct source on a proxy feature and on the gate."
  - "specs/app-spec.md + MANUAL.md document the convention; identity no longer labeled experimental."
validation:
  - method: run deepface:detect on an image
    expected: row has source=proxy
  - method: run identity_gate_dir
    expected: rows/CSV have source=real
  - method: build + grep
    expected: every listed plugin emits a source field
