    control: the report lists the parsed key per file; an unparseable file lands in
      group "_ungrouped", never silently merged.
  - scenario: Calibration recommends a threshold from too few anchors.
    control: minimum-sample guard (report refuses a recommendation below n=4 anchors,
      still prints distributions).
validation:
  - method: cargo test (grouping parser, verdict-exclusion math, calibration stats)
    expected: pass
  - method: ui-inspect compare tab with anchor strip, both themes
    expected: OOB=0, overlaps=0
