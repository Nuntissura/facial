  - "render_eval --dir DIR groups by config key and emits per-group mean/min/max
     similarity + counts per verdict; no_face/error rows are never counted as passes."
  - "anchor_montage --image PATH (or --dir) emits candidate-vs-anchors montage with the
     WP-016 tile-map format."
  - "calibrate_threshold reports anchor pairwise self-consistency stats + negative-set
     distribution + a recommended threshold with its reasoning fields."
  - "Compare tab can pin the anchor set as a strip above/beside a lane (GUI inspected
     in both themes)."
red_team:
