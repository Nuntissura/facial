assumptions:
  - source apps are integrated through deterministic Rust runtime modules
  - optional external dependencies may be installed later for richer runtime behavior
non_goals:
  - model training
  - full UI redesign beyond desktop workflow surfaces
acceptance_criteria:
  - plugin manifests are discoverable and load without app startup errors
  - feature keys from all five source apps are listed in UI
  - image ingest supports both copy and in-place behavior
  - pipeline execution writes run artifacts under worktree/runs/<run_id>/
  - no external windows/browsers are launched by UI actions
  - in-app manual is visible and documents startup/run/debug paths
  - run results are accessible from visual debugger and run output path
validation:
  - method: manual launch
    expected: app opens and can run a pipeline feature from at least one plugin on selected images
notes:
  - follow-up: replace fallback adapters with direct upstream calls where external deps are available
