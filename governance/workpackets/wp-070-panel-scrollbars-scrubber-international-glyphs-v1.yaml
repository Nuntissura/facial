progress:
  landed:
    - "The nested folder-strip ScrollArea reserves its own scrollbar lane, and only while the strip actually scrolls, so short strips keep full row width."
    - "The windowed Viewer scrubber now derives its width from the row's measured trailing widgets instead of inheriting egui's 100-point slider default."
    - "The fullscreen scrubber's hard-coded 250-point reserve is replaced by the same measured reserve, so both scale with panel width and font scale."
    - "theme sets an explicit slider_width so no future slider silently inherits 100 points."
    - "Optional Windows system faces are appended to the proportional, monospace, and heading chains: several candidates per script, each independently fallible."
  verified:
    - "Live snapshot: a Japanese filename renders correctly in the Viewer metadata - direct visual proof, not inference."
    - "Font candidate resolution on this machine: jp -> YuGothR.ttc, kr -> malgun.ttf, th -> LeelawUI.ttf, cjk -> msyh.ttc, emoji -> seguiemj.ttf. Meiryo is absent here, which is why several candidates per script were needed."
    - "Inter remains the head of the proportional chain; Latin rendering unchanged."
  initial_outstanding:
    - "Korean, Thai, Cyrillic and emoji filenames not yet visually confirmed at readable size; only Japanese was confirmed directly."
    - "The operator's Cyrillic and emoji reports remain UNREPRODUCED - measured cmaps show Inter and NotoEmoji already cover them, so their reported failure has another cause."
    - "Dual-scrollbar overlap fix not yet visually confirmed against a strip long enough to force both bars."
    - "Startup time and memory delta from font loading not measured."
    - "Inspector font set not yet pinned, so ui-inspect determinism across machines is unproven."
verification_round_2:
  - "Scrollbar overlap VISUALLY CONFIRMED fixed via a new media_scrollbar_nested inspector preset that hovers inside the folder strip so both floating bars are live: the strip bar and the grid bar now occupy separate x lanes."
  - "International glyphs VISUALLY CONFIRMED for all seven fixtures in one frame (Latin, Japanese, Korean, Thai, Cyrillic, Chinese, emoji) via a new media_international_names preset."
  - "ROOT CAUSE FOUND during that check: the inspector rasterizes PNGs with resvg through its OWN font database, so inspector output showed tofu while the live app rendered correctly. The project's standing GUI-verification tool was lying about exactly the defect class it exists to catch. Fixed by loading the same system faces into the resvg fontdb."
  - "SCRUBBER ROOT CAUSE CORRECTED: it was not merely short. egui draws a slider trough with widgets.inactive.bg_fill, which is page-white in the paper palette, so the rail was invisible and only the handle painted. theme::transport_slider now gives all six transport sliders a visible trough, an ink handle, and an explicit rail length. Verified live: the Viewer scrubber spans the panel with the handle at 0:09 of 0:30."
  - "Font cost MEASURED: Yu Gothic 13.2 MB, Malgun 12.8, Microsoft YaHei 18.8, Segoe UI Emoji 11.9, Leelawadee UI 0.4 = ~57 MB. Documented, and opt-out added via FACIAL_SYSTEM_FONTS=0."
  - "Two tests added: one asserting each resolved face parses under ab_glyph and covers its script, one asserting egui resolves those scripts to real glyphs rather than the replacement box."
  - "Still outstanding: Meiryo is absent on this machine, so the Japanese path was proven through Yu Gothic; a machine missing every candidate for a script still renders tofu."
base_scope:
  - "Stop the nested folder-strip scrollbar from sharing an x band with the outer Library grid scrollbar."
  - "Give the windowed Viewer scrubber width-derived sizing instead of egui's 100 point default."
  - "Replace the fullscreen scrubber's hard-coded 250 point reserve with a measured reserve derived from the widgets on the row."
  - "Set an explicit slider width in the theme so no future slider silently inherits the default."
  - "Load optional Windows system fonts through the known-folder API and append them to the existing fallback chains for Japanese, Korean, Thai, Chinese, and emoji coverage."
  - "Align the inspector's separate offline font path so snapshots are trustworthy evidence for international filenames."
  - "Attempt live reproduction of the Cyrillic and emoji reports and record the outcome either way."
high_roi_additions:
  - "Add a reusable test fixture folder of filenames in each target script so any model can reproduce the glyph check."
  - "Increase scrubber hit height for pointer and controller seeking, consistent with the existing couch-distance intent."
  - "Record startup time and resident memory before and after font loading so the size and cost trade is evidence."
  - "Fix the shared id_source used across both branches of the navigator folder lists while the scroll surfaces are being touched."
reuse:
  - "Existing WP-050 scrollbar identity: 24 point grab region, 64 point minimum handle, hidden at rest, revealed on hover."
  - "Existing width-derived scrubber sizing already used by the fullscreen path and the Library inline tile."
  - "Existing FontDefinitions setup with retained egui default fallbacks and insert-at-front ordering."
  - "Existing constrained-window and high-font-scale inspector preset pattern."
gaps_closed:
  - "Floating scrollbars reserve no layout width, so the nested folder-strip scrollbar is drawn over the outer grid scrollbar."
  - "The windowed Viewer scrubber uses a plain slider and inherits a fixed 100 point width while the fullscreen scrubber scales with panel width."
  - "No loaded font contains any Japanese, Korean, Thai, or CJK glyph, so those filenames render as tofu."
  - "The inspector rasterizes SVG through a separate font database pinned to Inter, so snapshots would show tofu even if the live app rendered correctly."
acceptance_criteria:
  - "With a folder strip long enough to scroll inside a grid long enough to scroll, the two scrollbars no longer share an x band, verified by direct inspection of the rendered image."
  - "A scrollbar lane is reserved only when the strip actually scrolls, so short strips lose no row width and folder names are not truncated."
  - "The windowed Viewer scrubber scales with panel width at default, narrow, and wide widths, and the fullscreen scrubber continues to scale."
  - "Minimum widths keep the transport button, time label, and volume control inside the panel at constrained window size and high font scale."
  - "Japanese, Korean, Thai, Russian, and emoji filenames render without tofu in the grid caption, the Viewer metadata, and the tab title."
  - "Every system font load is optional and independently fallible; a missing face degrades to current behaviour with a stated diagnostic and never blocks startup."
  - "Inter remains the head of the proportional chain and Latin rendering is unchanged."
  - "Inspector output remains deterministic by pinning the inspector's font set rather than inheriting host-installed fonts."
  - "The Manual states the monochrome-emoji limitation, the optional system-font dependency, and any Thai shaping limitation honestly."
  - "The Cyrillic and emoji reports are either reproduced and diagnosed from evidence, or recorded as unreproduced; neither is claimed fixed without proof."
  - "Startup time and resident memory deltas from font loading are measured and recorded."
risks:
  - scenario: "Loading several multi-megabyte system fonts inflates startup time and memory."
    mitigation: "Measure the delta, load off the first-paint path if warranted, and record the numbers rather than assuming."
  - scenario: "A required system font is absent on a given Windows SKU."
    mitigation: "Each load is optional and independently fallible with a diagnostic naming which faces resolved."
  - scenario: "Font fallback order regresses Latin rendering."
    mitigation: "Append system faces after existing entries, assert the chain head is unchanged, and compare a Latin-only snapshot before and after."
  - scenario: "Deterministic ui-inspect snapshots stop being byte-identical because host font availability varies."
    mitigation: "Pin the inspector's font set explicitly and state that contract."
  - scenario: "A wider windowed scrubber pushes the time label or volume control out of the panel at small window sizes."
    mitigation: "Minimum widths per widget plus inspector coverage at constrained window size and high font scale."
  - scenario: "Reserving a scrollbar lane narrows rows and truncates folder names."
    mitigation: "Reserve only when the strip scrolls, and inspect short, long, and deep folder lists."
  - scenario: "The scrollbar fix is asserted from code reading rather than seen."
    mitigation: "Acceptance is direct inspection of the rendered image at a strip length that forces both scrollbars."
  - scenario: "Emoji render monochrome and are reported as full colour support."
    mitigation: "State the COLR/CPAL limitation plainly; do not claim colour emoji."
