base_scope:
  - "Establish a clean embedded SurrealDB media application store without importing legacy notes, tags, labels, favorites, settings, inventory, or CLIP embeddings."
  - "Inventory and hash every candidate legacy media database before moving or retiring it; distinguish Facial media state from the separate Timeline ledger, raw media, and unrelated databases."
  - "Keep one cold untouched legacy-media backup outside the live runtime path until the clean baseline, restart, relocation, and rollback proofs pass."
  - "Remove the audited current media database targets from live discovery only through the state-bound verified cold-copy-and-quarantine transaction, then initialize and prove the replacement clean baseline; do not delete either recovery copy without a later exact operator approval."
  - "Regenerate only derived state that the current product needs, including inventory and CLIP embeddings, through existing explicit jobs."
non_goals:
  - "No lossless legacy media-metadata conversion."
  - "No modification, migration, retirement, or deletion of the Timeline ledger."
  - "No Match implementation."
acceptance_criteria:
  - "The live media application opens one schema-marked SurrealDB root and resolves no redb runtime package, code path, or live database path."
  - "A machine-readable manifest records every inspected legacy candidate, canonical path, type, size, hash, ownership verdict, and final live/archive disposition."
  - "The new media store starts without imported notes, tags, labels, favorites, settings, inventory, or CLIP rows and survives separate-process restart and workspace relocation."
  - "Raw-media, thumbnail-cache, and unrelated-state metadata-tree inventories are unchanged without reading their file contents or emitting per-file manifest rows. Exact retirement targets and both recovery copies remain content-SHA-256 equivalent. When a Timeline ledger exists it remains byte-for-byte or row/hash equivalent to its pre-work proof; when none exists the manifest records the explicit matching Audit/Execute no-ledger acknowledgement."
  - "All seven present and absent exact candidate paths are reconciled after every long protected-tree scan and immediately before ready; the current engine marker is quarantined before its SurrealDB directory, and a candidate that appears during Execute fails closed without deletion or a false-ready manifest."
  - "The GUI, CLI, metadata store, inventory regeneration, and optional CLIP rebuild operate from the clean SurrealDB baseline."
  - "The cold legacy-media backup remains recoverable and is not consulted by normal runtime discovery."
  - "Cold and quarantine copies remain outside the installer `.facial` cleanup boundary and survive a simulated Full/uninstall state cleanup."
  - "The `media_db_status` receipt reports exact component counts, distinguishes internal schema rows from operator settings, and proves whether user state is clean without treating read errors as empty state."
validation:
  - method: "cargo tree --manifest-path product/Cargo.toml | Select-String redb"
    expected: "No output."
  - method: "Fresh-process write, close, reopen, relocate, and read probe against the new media SurrealDB root"
    expected: "Schema marker and newly written values survive; no legacy value appears."
  - method: "powershell -ExecutionPolicy Bypass -File product/scripts/test-retire-legacy-media-db.ps1"
    expected: "Audit/execute, preservation, ambiguity, idempotence, pre-move failure, and post-move failure tests pass without touching live state."
  - method: "facial-cli media_db_status"
    expected: "The fresh live store reports clean_user_state=true, zero operator/inventory/CLIP rows, two current internal schema/catalog rows, and the exact SurrealDB engine marker."
  - method: "powershell -ExecutionPolicy Bypass -File product/scripts/check-exe-layout.ps1"
    expected: "The extracted setup payload passes Timeline plus fresh/reopen/relocate/non-importing media SurrealDB smoke tests."
  - method: "Independent target content-SHA-256 plus protected metadata-tree before/after reconciliation"
    expected: "Only exact Facial media-state targets change disposition; every target/cold/quarantine content hash matches; raw media, thumbnails, and unrelated state retain identical compact metadata-tree digests whose directory records contain relative path/type and whose file records additionally contain size/UTC creation+write ticks/attributes, without protected-file content reads or per-file manifest rows; an existing Timeline ledger remains content-equivalent, or the manifest carries the explicit matching Audit/Execute no-ledger acknowledgement."
  - method: "Deterministic target-appearance and marker-first rollback probes in product/scripts/test-retire-legacy-media-db.ps1"
    expected: "A candidate created after Execute inventory is preserved but prevents ready; marker precedes database in quarantine order; injected failures restore both current targets."
  - method: "powershell -ExecutionPolicy Bypass -File governance/check-governance-yaml.ps1"
    expected: "All governance YAML parses."
risks:
  - scenario: "A legacy-looking path is actually raw media, the Timeline ledger, or another application's database."
    mitigation: "Inspect exact canonical targets, database signatures, table names, sizes, and hashes; reject any ambiguous target and require explicit operator resolution."
  - scenario: "Starting fresh removes a preference or favorite the operator later wanted."
    mitigation: "Keep the untouched cold backup recoverable and record the intentional metadata waiver; do not permanently delete it in this packet."
  - scenario: "The app silently falls back to a legacy path after restart."
    mitigation: "Prove live path resolution in separate processes and add a source/configuration guard rejecting legacy runtime discovery."
  - scenario: "Protected-tree verification hashes hundreds of gigabytes or materializes millions of manifest rows, making the safety path slower and less reliable than the database operation."
    mitigation: "Content-hash only exact retirement and Timeline artifacts; protect raw media, thumbnails, and unrelated state with a deterministic compact metadata-tree digest that is token-bound and recomputed before and after the exact move."
  - scenario: "An absent legacy candidate appears during a long scan, or Facial starts between the two current-target renames."
    mitigation: "Reconcile every exact path after each scan and before ready; move the marker first so startup refuses the unmarked nonempty store; retain both recovery copies and fail closed on any reappearance."
notes:
  - "Operator direction 2026-08-22: a clean start is preferred over migrating legacy media curation data."
  - "This packet records the 2026-08-22 correction that cancels the same-session proposal to migrate surviving legacy media data; it refines WP-078 media cleanup and does not weaken Timeline-ledger preservation."
  - "Match implementation packets WP-080 through WP-087 are hard-blocked on this packet."
