workpacket_id: >-
  WP-021
title: Wave-2 curation signals - PIPNet 98-pt landmark engine, eyes-open EAR (real), occlusion proxy
status: completed
validation_results:
  - "Gate 1 (tract load — the spike's biggest unknown): pipnet_r18_wflw_98.onnx
     (49,322,829 bytes, sha256 9862838dc6144bc772b6485f6f6d31295c0b1c1ab7293e6ddeb0a4
     39cb10218d, MIT license vendored) loads under tract-onnx 0.21 and passes the
     5-output layout self-check (3x [1,98,8,8] + 2x [1,980,8,8]). Unit test
     engine_loads_under_tract_when_model_is_provisioned proves it in CI on this machine."
  - "Gate 2 (decode): synthetic-map unit tests pin argmax+offset+sigmoid-confidence and
     the reverse-neighbor merge exactly; meanface (196 vendored values) parses, 10
     unique non-self neighbors per landmark."
  - "Gate 3 (EAR separation, real photos): 10/10 leeseo anchors -> eyes_open=open,
     min-EAR distribution 0.317-0.417 (well above ear_open_min 0.15); painted eye-band
     variants dropped EAR to 0.250-0.271 while a mouth band left EAR at ~0.37 — the
     signal responds specifically to eye-region disruption. Synthetic-geometry unit
     test pins open-vs-closed bucketing."
  - "Gate 4 (occlusion proxy): FAILED — landmark_conf_min 0.565-0.580 across clean,
     skin-band-eyes, black-band-eyes, and black-band-mouth manipulations (no
     separation). Per the spike contract the occluded_regions flag is WITHHELD (code
     removed, not hidden); landmark_conf_min ships as an honest localization
     measurement only. Honest occlusion = segmentation model, future packet."
  - "Integration: gate rows/CSV gain eyes_open, ear_left, ear_right (+ear_method/
     ear_open_min stamps), landmark_conf_min; columns ride identity_gate/_dir and
     render_eval and flow into review filters via the gate-manifest join;
     identity_status reports the landmark engine block; lazy load keeps launch fast.
     cargo test 30/30."
