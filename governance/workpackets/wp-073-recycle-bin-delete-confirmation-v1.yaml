    - "The old fs::remove_file delete (permanent, unconfirmed, render-thread) is gone; a structural test pins the confirmed worker as the only delete call site."
    - "Root classification at arm time: UNC prefixes and DRIVE_REMOTE mapped drives are named PERMANENT in the modal (error ink) with split counts for mixed selections."
    - "Off-thread worker with MediaDeleteDone completion: rows leave the lane and the published display order through a one-step remap (never blanked, no stale indices), runtime tab inventory refreshed, metadata rows kept for Recycle Bin restore."
