refinement: governance/refinements/wp-052-video-thumbnail-playback-v1.md
base_scope:
  - Generate real cached thumbnails for visible and prefetched videos without slowing image browsing.
  - Embed selected-video playback in the right Media page through optional LibVLC.
  - Provide play/pause, timeline scrub, volume, audio-track, and subtitle-track controls.
  - Provide explicit Open in VLC and Windows Choose app actions.
high_roi_additions:
  - Isolate FFmpeg behind one dedicated worker and a bounded timeout.
  - Add contextual Enter/controller A play-pause behavior.
  - Add receipt-backed media_video_control for model operation and proof.
  - Add native LibVLC frame capture so models can inspect video without desktop automation.
  - Discover FFmpeg and VLC through relocatable environment/configured roots.
  - Make automated playback diagnostics opt-in silent through FACIAL_TEST_SILENT.
  - Harden external Unicode media paths so a video-heavy folder cannot panic metadata key generation.
reuse:
  - WP-043 priority queues, generation cancellation, sharded cache, failure memoization, and texture LRU.
  - WP-044 right preview and selected-media state.
  - WP-046 controller action mapping.
  - WP-010 receipt-backed live GUI intent path.
acceptance_criteria:
  - Image thumbnail workers never execute video extraction.
  - Visible video tiles show cached representative frames when FFmpeg is available.
  - Missing/failed FFmpeg retains a nonblocking film-strip fallback.
  - LibVLC remains unloaded until explicit playback.
  - Live embedded playback supports timeline, volume, audio tracks, and subtitle tracks.
  - Native video never covers in-app overlays or non-Media tabs.
  - Open in VLC and Choose app launch only from explicit operator actions.
  - Enter/controller A and media_video_control operate selected-video playback.
  - capture_frame exports a non-empty PNG and reports its path plus live player state.
  - A 664-video external folder with Korean filenames scans without a panic or audible playback.
  - Manual, specification, topology, executable, and installer are synchronized.
validation:
