[package]
name = "facial-engine-compatibility-candidate"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
surrealdb = { version = "=3.3.0", default-features = false, features = ["kv-surrealkv"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"

# Candidate observability only; upstream release TRACE spans require this gate.
[profile.release.package.tracing]
debug-assertions = true
