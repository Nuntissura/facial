[package]
name = "facial"
version = "0.1.7"
edition = "2021"
default-run = "facial"

[[bin]]
name = "facial"
path = "src/main.rs"

[[bin]]
name = "facial-cli"
path = "src/bin/facial-cli.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
# "persistence" remembers window size/position between sessions (user-profile
# app-data storage, machine-local by design).
eframe = { version = "0.27", features = ["persistence"] }
egui = "0.27"
# Phosphor icon font for tab/button icons; 0.5.x is the egui 0.27 line (WP-015).
egui-phosphor = "0.5"
image = "0.25"
regex = "1.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# Facial's only application-owned database technology. Engine changes are
# explicit upgrades gated by the populated compatibility fixture.
surrealdb = { version = "=3.2.4", default-features = false, features = ["kv-surrealkv"] }
walkdir = "2.5"
# Pure-Rust ONNX inference (no Python / no native runtime) for the optional,
# deterministic face-identity engine. Models are provisioned at runtime.
tract-onnx = "0.21"
gilrs = "0.11"
# Pure-Rust Exif reader (WP-043): thumbnail orientation honored at decode.
kamadak-exif = "0.6"
libloading = "0.8"
# eframe exposes its exact native window through this trait. The live UI passes
# the Win32 HWND into the lazy LibVLC host instead of rediscovering an active
# window at playback time.
raw-window-handle = "0.6"
# Pure-Rust SVG rasterization keeps ui-inspect PNG output self-contained; no
# browser, ImageMagick, or desktop automation is required for visual review.
resvg = "0.48.1"
# Recycle Bin / Trash moves for the confirmed delete path (WP-073).
# Field-standard cross-platform crate over the modern shell operation API;
# long-path aware, unlike legacy SHFileOperationW. Pure-Rust bindings keep the
# Rust-native mandate (CODEX section 4) intact.
trash = "5"
# Pure-Rust glyph rasterization for burned-in filenames on the exported
# contact sheet (WP-074). Already vetted as a dev-dependency for inspector
# assertions; promoted so the export honors the caption toggle.
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
# Win32_System_Com: CoInitializeEx for SHOpenFolderAndSelectItems (WP-073
# Open-file-location reveal; the split-argument explorer /select spawn never
# selected the file).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Multimedia", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
ab_glyph = "0.2"
