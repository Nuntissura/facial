project:
  id: facial-workbench
  name: facial
  version: 0.1.7
  root: .
  created_at: 2026-06-08
  governance_root: governance
  specs_root: specs
  product_root: product
  worktrees_root: worktrees
  app_entrypoint: product/Cargo.toml
  command: cargo run --manifest-path product/Cargo.toml --bin facial -- --background

path_contract:
  default_paths:
    workspace_root: .
    workspace_state_root: .facial
    worktrees_root: .facial/worktrees
    model_registry: .facial/data/model_registry.json
    debug_events: .facial/data/events.jsonl
    audit_notes: governance/existing_app_audit.md
    canonical_exe: installer/facial-portable-<version>.exe     # WP-059: one current portable artifact at installer root
    canonical_installer: installer/facial-setup-<version>.exe  # WP-059: one current setup artifact at installer root
    delivery_archive: installer/installer-portable-archive     # every superseded portable/setup artifact
    cargo_build_dir: product/target                            # transient in-repo build/test scratch; package-release.ps1 removes it after validation
  retired_paths:
    - path: product/facial.exe      # WP-059: migrated to installer/facial-portable-<version>.exe
      reason: superseded_by_installer_root_delivery_pair
    - path: product/archive/exe     # WP-059: migrated to installer/installer-portable-archive
      reason: superseded_by_delivery_archive
    - path: installer/out           # WP-059: installer publishes at installer root
      reason: superseded_by_installer_root_delivery_pair
    - path: product/release         # retired release folder
      reason: superseded_by_canonical_exe
    - path: product/dist            # WP-022: retired exe drop surface; drained into exe_archive, must stay absent
      reason: superseded_by_exe_archive
  plugin_roots:
    - product/plugins

runtime:
  backend:
    language: rust
    package_root: product
    modules:
      - Cargo.toml
      - src/lib.rs
      - src/timeline_ledger.rs
      - src/timeline_ui.rs
      - src/main.rs
      - src/bin/facial-cli.rs
      - src/config.rs
      - src/models.rs
      - src/debug.rs
      - src/service.rs
      - src/plugin_host.rs
      - src/plugins.rs
      - src/plugins/common.rs
      - src/plugins/facet.rs
      - src/plugins/python_ofiq.rs
      - src/plugins/deepface.rs
      - src/plugins/imagededup.rs
      - src/plugins/ediffiqa.rs
      - src/identity.rs
      - src/landmarks.rs
      - src/review.rs
      - src/api.rs
      - src/theme.rs
      - src/folder_picker.rs
      - src/media_io.rs
      - src/media_tabs.rs
      - src/media_input.rs
      - src/video_player.rs
      - src/ui.rs
      - src/ui_inspect.rs
  frontend:
    type: desktop
    framework: eframe
    entry: src/main.rs
    gui_entry: src/main.rs
    cli_entry: src/bin/facial-cli.rs
    run_command: cargo run --manifest-path product/Cargo.toml --bin facial -- --background
    cli_command: cargo run --manifest-path product/Cargo.toml --bin facial-cli -- COMMAND
    package_command: powershell -ExecutionPolicy Bypass -File product/scripts/package-release.ps1
    invariant_check_command: powershell -ExecutionPolicy Bypass -File product/scripts/check-exe-layout.ps1   # WP-059: exactly one current portable + setup at installer root
    installer_source: installer/facial.iss                       # WP-025: Inno Setup script (4-mode wizard)
    installer_output: installer/facial-setup-<version>.exe       # WP-059: one current setup artifact at installer root
    latest_executable: installer/facial-portable-<version>.exe
    executable_archive: installer/installer-portable-archive
    workspace_select_command: facial-cli set_workspace_root --path DIR
    state_probe_command: facial-cli get_state
    installed_data_root: '%LOCALAPPDATA%/Facial'
    installed_shortcut_target: facial.exe
    executable_subsystems: {facial.exe: windows_gui_2, facial-cli.exe: windows_console_3}
  visual_debugger:
    type: ui_log_stream
    source: .facial/data/events.jsonl
  interaction_contract:
    gui_opens_external_window: false
    captures_input_globally: false
    built_in_manual_present: true

workflows:
  implementation_authority:
    status: active
    rules: governance/build_rules.yaml
    startup_reads: [CODEX.md, topology.yaml, governance/build_rules.yaml, governance/taskboard.yaml, active_workpacket, active_refinement, touched_spec_anchors]
  app_setup:
    status: planned
    docs:
      spec: specs/app-spec.md
  governance_sync:
    status: active
    artifacts:
      - governance/taskboard.yaml
      - governance/work_packet_template.yaml
      - governance/workpackets
    machine_readable_check:
      command: powershell -ExecutionPolicy Bypass -File governance/check-governance-yaml.ps1
      rule: FACIAL-VERIFY-006
      covers: every *.yaml under governance/ plus topology.yaml
      why: >-
        The machine-readable-governance claim was untested, and 15 work packets
        (WP-012/013/015/016/019/020/021/022/023/024/025/026/027/047/050) had been
        unparseable for months as a result. All 76 artifacts now parse.
      negative_tested: >-
        One unquoted colon scalar appended to a work packet makes the check exit 1
        naming the file and line; removing it returns the run to exit 0.

constraints:
  data_mutation:
    default_image_ingest_mode: copy
    in_place_mode: toggle
  portability:
    avoid_hardcoded_user_paths: true
    allow_relative_paths: true
    app_install_root_separate_from_workspace_root: true

identity_gate:
  workpacket: WP-007             # + WP-019 metadata columns, WP-020 bundled detector
  engine: rust_native            # ArcFace + YuNet via tract; no external cv2/python
  detector_default: bundled_yunet_2023mar  # include_bytes, MIT, self-checked; override via identity_detector_path
  detector_origin_vocab: [override, bundled, bundled_fallback, none]
  commands:
    single: facial identity_gate --image PATH
    batch: facial identity_gate_dir --dir DIR
  count_threshold_config: identity_count_threshold   # default 0.9; FACIAL_IDENTITY_COUNT_THRESHOLD
  nms_threshold: 0.3
  metadata_columns: [face_crop_sharpness, yaw_estimate, yaw_ratio, hair_color, hair_confidence,  # WP-019 wave 1
                     eyes_open, ear_left, ear_right, landmark_conf_min]                          # WP-021 wave 2
  landmark_engine:                # WP-021: PIPNet 98-pt (WFLW), lazy-loaded, operator-provisioned
    model: pipnet_r18_wflw_98.onnx   # ~47MB, MIT; config landmark_model_path / FACIAL_LANDMARK_MODEL / conventional product/models path
    decode: rust_graph_external      # 1.2x crop, ImageNet norm, argmax+offset+reverse-neighbor merge (vendored WFLW meanface)
    eyes_open: real                  # simplified WFLW EAR; method+threshold stamped per row
    occlusion: withheld              # cls-confidence proxy failed validation separation (WP-021 evidence)
    modules:
      - product/src/landmarks.rs
  batch_output_root: <copy_location>/runs/<run_id>   # else <dir>/.facial/runs/<run_id>
  batch_artifacts:
    - identity_gate.csv          # WP-019 extended header
    - manifest.json              # schema_version 2
  deterministic: true            # sorted inputs + stable NMS tiebreak -> byte-identical CSV

review_queue:
  workpacket: WP-016
  store_root: <copy_location>/review/<session_id>    # else <workspace_root>/.facial/review
  store:
    - session.json               # immutable init metadata
    - images.json                # rows: sha256 id, short_id, path, shard, metadata?, cluster_id?
    - ledger.jsonl               # append-only: init | claim | steal | decide | export
    - claims/shard_<k>.json      # atomic create_new claim-by-existence
    - montages/                  # montage_<scope>_p<n>.png + .map.json (id-keyed tiles)
  commands: [review_init, review_claim, review_decide, review_status, review_montage, review_export]
  joins:
    gate_manifest: identity_gate_dir manifest rows -> row metadata (filters, face-crop tiles)
    clusters: identity_dedup groups -> cluster_id (grouped tiling, per-cluster status)
  export:
    layout: kohya_imagedir_v1    # <out>/<repeats>_<name>/ + dataset_manifest.json (lineage funnel)
    integrity: sha256 verified before copy; drifted/missing files reported, never copied
  parallel_agents: claim-by-rename shards; conflicts surfaced (last-write-wins effective, history kept)
  modules:
    - product/src/review.rs

identity_tooling:
  workpacket: WP-017/WP-018
  commands:
    identity_dedup: ArcFace-cosine greedy clusters + recommended keeper (20k cap, deterministic)
    render_eval: per-config-key mean/min/max vs anchors; no_face/error excluded from stats
    calibrate_threshold: anchor pairwise + negative distribution -> recommendation (refuses <4 anchors)
    anchor_montage: candidate-vs-anchors grid + per-anchor cosine in map
  gui:
    anchor_strip: Compare toolbar toggle; identity_reference_dir thumbnails (cap 24, off-thread)

gui_inspector:
  workpacket: WP-008
  engine: headless_egui          # egui Context::run, CPU layout, no window, no renderer
  dependencies: none_external    # egui/eframe + serde_json only; no egui_kittest/screenshot crate
  command: facial-cli ui-inspect [--out DIR] [--tab VOCAB ...]
  shared_render_path: ui::FacialApp::render_ui   # live app + inspector use the same path
  output_root: <workspace_root>/.facial/ui-snapshots/<timestamp>
  settle_passes: 3               # ScrollArea content memory needs 3 frames to converge (WP-014)
  artifacts:
    - <tab>.png            # direct pure-Rust raster for model/operator visual review
    - <tab>.svg            # vector wireframe retained beside the direct PNG
    - <tab>.layout.json    # rects + text with x,y,w,h + clipped flag for model review
    - compare.svg          # canonical Compare tab snapshot; lanes remains temporary input alias only
    - compare.layout.json
    - compare_dialog.svg   # folder browser forced open over Compare mode (10 passes: auto-size growth check)
    - compare_dialog.layout.json
    - media_search_subtractive.png         # mixed additive/subtractive query with visible exact filter tokens
    - media_search_subtractive.layout.json # model-readable proof that the negation marker is visible
    - media_search_autocomplete.png         # focused file-result popup exercised through an exact row click
    - media_search_autocomplete.layout.json # model-readable popup row identity and geometry
    - media_search_scope_tab.png             # whole-tree search scope with This folder disabled
    - media_search_scope_folder.png          # direct-folder search scope with This folder enabled
    - media_delete_confirm.png               # WP-073 mixed local+network delete confirmation with split counts
    - media_delete_confirm_permanent.png     # WP-073 explicit permanent-mode confirmation wording
    - media_viewer_meta_high_font.png        # WP-072 resized metadata band at 32pt; editors must be unclipped
    - media_select_batch.png                 # WP-074 batch selection: count + Sheet visible, Sheet names absent
    - media_select_sheet.png                 # WP-074 selection sheet: only selected files, caption toggle present
    - media_receiving_pane.png               # WP-075 right panel bound to another tab as a receiving folder
    - index.html
    - index.json
    - live-video/<action-id>.png # native LibVLC frame from media_video_control capture_frame
    - live-ui/<action-id>.png    # exact live framebuffer; active native video composited at diagnosed bounds
    - live-ui/<action-id>-video.png # LibVLC snapshot or exact diagnosed framebuffer-region sidecar
  layout_json_semantics:
    text_anchor: top_left        # right/center-aligned galleys are normalized via galley.rect (WP-014)
    clipped_flag: true           # geometry cropped by a ScrollArea/TextEdit clip is marked clipped
  no_foreground_window: true     # CODEX FACIAL-MODEL-INSPECT; never activate/raise/focus for model inspection
  live_background_launch: facial.exe --background
  live_snapshot_intent: facial-cli ui_snapshot [--out FILE.png]
  media_db_isolation: <snapshot-root>/_inspector-workspace/.facial/media/surrealdb
  deterministic: true            # unchanged GUI -> byte-identical layout.json
  # Presets that FAIL THE RUN instead of writing a picture to read. A non-zero
  # exit from ui-inspect is a regression, not a rendering hiccup. The failing
  # render is written before each gate, so the artifact is still inspectable.
  enforcement_presets:
    media_labels_performance_ab:
      workpacket: WP-061
      invariant: candidate multi-label visible-tile painting stays within 10 percent p50 and p95 of the same-binary empty-label baseline and below 16.7 ms p95
      probe: full render_ui frame timing over the 50k-key virtualized fixture, currently emitted inside the Media inspection sequence
      failure_mode: the Media inspector aborts before later presets when the relative or absolute budget fails
      measurement_limit: current full-frame timing observes only two visible tiles per frame and groups the two candidate blocks together, so a relative-p95 failure is a gate failure but does not by itself prove label painting caused user-visible stutter
    media_folders_opaque_backdrop:
      workpacket: WP-064
      invariant: the Folders window paints after its own full-screen blurred backdrop
      failure_mode: backdrop covers the window; the app looks frozen behind a blur
    media_render_txn_free:
      workpacket: WP-069
      invariant: a settled media frame opens zero storage transactions
      probe: ui::FacialApp::debug_media_transaction_count over 3 settled frames
      failure_mode: a database read inside the paint loop stutters large folders
    media_collection_remove_row:
      workpacket: WP-067
      invariant: a favourite row whose file does not exist can be removed from the tab
      failure_mode: an unreachable row is stuck in the collection forever
    media_international_names:
      workpacket: WP-070
      invariant: no two same-baseline tile captions overlap; every script fixture renders
      failure_mode: a wide-glyph filename overruns its tile and covers its neighbour
    media_search_subtractive:
      workpacket: WP-066
      invariant: every subtractive filter renders with its leading ! or - marker
      failure_mode: an excluded filter is invisible or reads as additive, so the operator cannot explain or remove it
    media_search_autocomplete:
      workpacket: WP-066
      invariant: a focused file suggestion renders unclipped and clicking it selects its exact canonical path
      failure_mode: the popup is absent, clipped, text-only, or opens a neighboring file instead of the clicked result
    media_search_scope_tab:
      workpacket: WP-066
      invariant: the This folder scope control is visible in its disabled whole-tree state
      failure_mode: the operator cannot tell that search covers the recursive tab inventory
    media_search_scope_folder:
      workpacket: WP-066
      invariant: the This folder scope control is visible in its enabled direct-folder state
      failure_mode: the operator cannot tell that search is restricted to direct children
  modules:
    - product/src/ui_inspect.rs
    - product/src/video_player.rs # LibVLC-native diagnostic frame export

gui_theme:
  workpacket: WP-015             # WP-014 flat layout; WP-015 identity (fonts/accent/modes)
  style: flat_two_mode           # paper (light, default) | ink (dark); same structure
  mode_config: theme_mode        # "paper" | "ink"; FACIAL_THEME env override; Options toggle
  accent: vermilion_d6452a       # active tab underline + one primary button per surface + busy
  typography:
    ui_face: Inter               # vendored TTF, SIL OFL
    heading_face: Inter-SemiBold
    icon_face: phosphor          # egui-phosphor 0.5 (egui 0.27 line)
    fallbacks: egui_defaults     # retained for glyph coverage
  assets:
    - product/assets/fonts/Inter-Regular.ttf
    - product/assets/fonts/Inter-SemiBold.ttf
    - product/assets/fonts/Inter-LICENSE-OFL.txt
  window_identity:
    icon: programmatic_logomark  # theme::window_icon_rgba; no asset file
    min_inner_size: [980, 640]
    persist_geometry: true       # eframe persistence; user app-data store (machine-local)
  modules:
    - product/src/theme.rs
  guardrail: noninteractive.weak_bg_fill stays opaque  # transparent -> disabled widgets vanish (egui fade_out_to_color)

compare_tool:
  workpacket: WP-013             # operator-facing visual compare tool
  correction_workpacket: WP-031  # restores Compare as the visible tab; lanes are not the Compare name
  tab_label: Compare
  tab_vocab: compare
  compatibility_vocab: lanes
  pane_presets: [2, 4, 8]
  max_panes: 16
  folder_picker: in_app_egui     # product/src/folder_picker.rs; rfd removed per CODEX section 7
  navigation: [footer_buttons, numeric_jump, wheel_over_image, arrow_keys]
  pane_sync: optional_toggle_default_off
  modules:
    - product/src/ui.rs
    - product/src/folder_picker.rs

lane_headless_workflow:
  workpacket: WP-029
  batch_workpacket: WP-030
  correction_workpacket: WP-031
  purpose: model/headless parallel folder processing, claims, statuses, and bounded batches; not the operator Compare tab
  state_root: ".facial/lanes"
  registry: ".facial/lanes/lanes.json"
  claims: ".facial/lanes/claims/<lane_id>.json"
  commands:
    implemented:
      - list_lanes
      - set_lane
      - scan_lane
      - scan_all_lanes
      - claim_lane
      - release_lane
      - lane_status
      - start_lane_batch
      - start_all_lane_batches
    planned: []
  modules:
    - product/src/ui.rs
    - product/src/folder_picker.rs
    - product/src/lanes.rs
    - product/src/api.rs
    - product/src/service.rs
    - product/src/main.rs

timeline_module:
  status: active
  workpacket: WP-078
  purpose: professional group/member chronology over canonical Obsidian timeline stores plus isolated research intake
  front_tab: timeline
  modules:
    - product/src/timeline_ui.rs
    - product/src/timeline_ledger.rs
    - product/src/ui.rs
    - product/src/ui_inspect.rs
  project_discovery:
    anchor: timeline-maintenance.yaml
    configured_input: FACIAL_TIMELINE_ROOT or pasted path
    hardcoded_vault_path: false
  views: [overview, events, planned, sources, coverage]
  event_details: [summary, people, media, evidence]
  canonical_stores:
    - timeline-data/event-registry.jsonl
    - timeline-data/artifact-registry.jsonl
    - timeline-data/source-registry.jsonl
    - timeline-data/planned-events.jsonl
  intake_store: <timeline-project>/.facial/timeline-ledger/surrealdb
  invariants:
    - occurrence, publication, scheduled, and observed time are not conflated
    - intake captures never render as canonical events
    - unknown location and participation remain unknown
    - linked media scrolls independently inside an expanded event
    - event filtering and ordering is cached and renders at most 25 cards per page
  inspector_preset: timeline

media_browser:
  workpackets: [WP-042, WP-043, WP-044, WP-045, WP-046, WP-047, WP-048, WP-049, WP-050, WP-051, WP-052, WP-053, WP-055, WP-056, WP-057, WP-058, WP-060, WP-061, WP-062, WP-063, WP-064, WP-065, WP-066, WP-067, WP-068, WP-069, WP-070, WP-071]
  supersedes: [WP-033, WP-034, WP-035, WP-036, WP-037, WP-038, WP-039, WP-040, WP-041]  # redo pass, operator-directed 2026-08-06
  purpose: persistent folder tabs above a book-style media browser (Library panel + Viewer panel)
  hierarchy: Media > persistent folder tabs > Library and Viewer viewport
  panel_vocabulary:
    library: left folder-navigation and virtualized thumbnail-overview panel
    viewer: right selected-media playback and metadata panel
    split_label: Library / Viewer split
  front_tab: media                       # default tab on launch
  modules:
    - product/src/media_db.rs            # SurrealDB store: notes/tags/multi-label catalog+assignments/favorites/settings/inventory (WP-042/WP-061/WP-078)
    - product/src/media_thumbs.rs        # async thumbnail engine + disk cache + texture LRU (WP-043)
    - product/src/media_explorer.rs      # grid math, sort, breadcrumbs, persisted layout/playback state (WP-044/WP-053)
    - product/src/media_fs.rs            # rename/new-folder/cut-move helpers, Windows name rules (WP-045)
    - product/src/media_input.rs         # action map, bindings, repeat clock, capture, controller video transport (WP-046/WP-053)
    - product/src/media_search.rs        # fuzzy scorer, filter chips, autocomplete (WP-047)
    - product/src/media_io.rs            # bounded root-aware I/O coordination + playback activity (WP-057)
    - product/src/media_tabs.rs          # versioned persistent per-tab viewport snapshots (WP-063)
    - product/src/media_clip.rs          # CLIP tokenizer + tract encoders + embedding index (WP-047)
    - product/src/platform_input.rs      # Windows Alt+Tab + explicit controller pointer injection (WP-051)
    - product/src/video_player.rs        # lazy dynamic LibVLC embed + transport/track/loop controls (WP-052/WP-053)
    - product/src/ui.rs                  # surface glue (draw_media_* fns)
  state_paths:
    media_db: <workspace_root>/.facial/media/surrealdb           # shared embedded SurrealDB application store
    thumbs_cache: <workspace_root>/.facial/media/thumbs          # sha256-sharded 256/512-edge JPEGs
    clip_index: <workspace_root>/.facial/media/surrealdb::clip_embeddings  # regenerable embedding rows
    tabs: <workspace_root>/.facial/media/surrealdb::setting/media_tabs_v1  # versioned JSON value; persist-before-visible-mutation
    tabs_recovery: <workspace_root>/.facial/media/surrealdb::setting/media_tabs_v1_rejected  # complete raw value retained; primary persistence blocks if this recovery write fails
  key_contract: casefolded slash-normalized workspace-relative (portable across relocation)
  commands:
    backend: [media_meta_get, media_meta_set, media_meta_list, media_labels_list,
              media_label_create, media_label_update, media_label_delete, media_label_assign,
              media_fav_add, media_fav_remove, media_fav_list, thumbs_gc,
              media_index_build, media_semantic_search]
    ui_intents: [ui_snapshot, media_tabs, media_set_folder, media_search, media_select, media_open_selected,
                 media_folder_navigate, media_video_control, media_label_mutation]
    media_tabs_actions: [list, labels, select, open, close, open_collection, remove_from_view, set_scope, set_sort, navigate_grid, set_chrome, set_split, set_names, set_tile_size, delete_selected, set_meta_height, set_select_mode, set_sheet, export_sheet, move_to, copy_to, open_receiving_pane, close_receiving_pane]   # WP-067/066/068/069/070/065/073/072/074/075
    remove_from_view_intent: media_tabs --action remove_from_view   # acts on the current selection; shares one code path with the toolbar button; the ONLY way to unstar while the GUI holds the media db lock
    delete_intent: media_tabs --action delete_selected --path recycle|permanent   # WP-073; the explicit token is the confirmation; network/UNC roots have no Recycle Bin and report permanently_deleted; folders always skipped; outcomes withheld until delete_diagnostics.settled
    delete_outcome_vocab: [recycled, permanently_deleted, skipped_folder, "failed:<reason>"]   # WP-073; sourced from the executed branch per file
    delete_metadata_rows: kept_so_recycle_restore_finds_them   # WP-073
    caption_intents: [media_tabs --action set_names --path on|off, media_tabs --action set_tile_size --path POINTS]   # WP-070; caption behaviour was otherwise unreachable on a live app
    split_intent: media_tabs --action set_split --path RATIO   # WP-065; finite ratio clamped to 0.25..0.80, changes only in-app geometry, receipt exposes requested and applied state; poll video status/ui_snapshot for post-render native bounds
    meta_height_intent: media_tabs --action set_meta_height --path POINTS   # WP-072; per-tab Viewer metadata band height, 96..1200 static clamp plus render-time panel clamp (min 96, max 0.60 of panel, 60pt image floor); receipt reports requested and applied
    select_mode_intent: media_tabs --action set_select_mode --path on|off   # WP-074; plain click toggles membership; per tab
    sheet_intent: media_tabs --action set_sheet --path on|off|names_on|names_off   # WP-074; needs 2+ selected, rejected below that; pure view filter, never rescans; captions are sheet-local
    destination_intents: [media_tabs --action move_to --path DIR, media_tabs --action copy_to --path DIR]   # WP-074; act on the canonical selection, never the rendered display slice
    sheet_export_intent: media_tabs --action export_sheet   # WP-074; PNG beside the selection parent; results withheld until sheet_export.settled
    destination_pick_isolation: purpose_tagged_picker_never_assigns_lane_folder_or_starts_scan   # WP-074; source-level guard
    copy_backend: length_verified_collision_safe_sources_untouched   # WP-074 media_fs::copy_files
    receiving_pane_intents: [media_tabs --action open_receiving_pane --path TAB_ID, media_tabs --action close_receiving_pane]   # WP-075; right panel as a receiving folder; rejected for the active tab
    receiving_pane_isolation: no_activation_no_scan_no_singleton_grid_writes   # WP-075; source-level guard
    receiving_pane_playback: explicit_stop_when_pane_replaces_viewer   # WP-075; CODEX 8.2
    drag_payload_pinning: sources_and_destination_tab_and_folder_pinned_at_drag_start_revalidated_at_release   # WP-075
    drag_sources_active_only_with_pane: true   # WP-075; ordinary browsing keeps identical click semantics
    viewer_meta_band: operator_resizable_divider_plus_settings_slider_default_142   # WP-072; content below the identity row scrolls per tab instead of clipping
    collection_tab_refusals: [media_set_folder, set_scope, stat-based set_sort]   # a collection has no folder and no file metadata; refusing beats reporting success and changing nothing
    list_receipt_diagnostics: [media_io_diagnostics, thumbnail_diagnostics, query_diagnostics, scan_diagnostics, sort_diagnostics, delete_diagnostics, activation_restore, reconciliation, grid_navigation, chrome_hidden, native_fullscreen_changed, media_load_timing, media_load_timing_history, ui_frame_diagnostics, ui_filesystem_diagnostics]   # list is the documented polling loop, so it carries them
    scan_phase: enumerating | persisting_inventory | idle   # scan_active alone covers the inventory write, which far outruns enumeration on a large root
    scan_batch_fields: [first_batch_ms, first_batch_items, batch_count]   # makes the documented 64-item first batch checkable from a receipt
    ui_frame_max_window: session_cumulative
    ui_frame_recent_window: {window_ms: 2000, fields: [sample_count, p50_us, p95_us, max_us]}
    collection_intent: media_tabs --action open_collection --path fav_videos|fav_images|labels[:LABEL_ID]
    scope_intent: media_tabs --action set_scope --path folder|tab        # receipt states scan_unchanged/inventory_unchanged
    sort_intent: media_tabs --action set_sort --path name|modified|size|created[:asc|:desc]
    grid_navigation_intent: media_tabs --action navigate_grid --path left|right|up|down|page_up|page_down|home|end   # O(1) display-coordinate move; background-safe rolling frame-p95 driver
    receipt_publish_order: accepted_before_intent_visibility_then_terminal_replace
    receipt_windows_replace: writer_unique_temp_plus_bounded_sharing_violation_retry
    chrome_intent: media_tabs --action set_chrome --path hidden|visible   # in-app chrome only; never sends native fullscreen, activates, or raises the window; receipt native_fullscreen_changed=false
    order_provenance: media_tabs receipts report display_count + display_provenance (empty|provisional|settled) for the ACTIVE tab; display_head_paths, selected_path, and cursor_path provide exact bounded identity without a second filesystem enumeration
    label_catalog_intent: media_tabs --action labels   # read-only; works while the GUI holds the media db lock
    search_counts_settled: media_search matched/excluded counts are null until counts_settled is true
    video_loop_intent: media_video_control --action loop --value 0|1
    library_video_intent: compatibility_rejection_after_exact_nas_p95_gate_failure
    tile_video_action: select_video_and_play_in_viewer_with_no_library_grid_decoder
    video_pending_receipt: {status: preparing_surface, playing: false, fields: [pending_path, pending_surface_owner, pending_age_ms]}
    native_video_visual_proof: ui_snapshot [--out FILE.png] # composited live UI + decoded sidecar, no focus
    locked_gui_contract: backend media_meta_* against a live GUI return errored receipts (never ok-empty)
  search:
    modes: [name, fuzzy, semantic]
    chips: ["tag:", "label:", "kind:", "note:", "fav:"]          # WP-066 adds fav:
    negation: leading_bang_or_hyphen_on_chips_and_bare_words     # WP-066; quoted terms stay literal
    combination: and_across_additive_then_subtractive            # WP-066; no OR/grouping
    scope: per_tab_folder_only_filters_loaded_inventory          # WP-066; never triggers a rescan
    result_activation: suggestion_carries_path_index_generation  # WP-066; ctrl opens a new tab
    semantic_engine: clip_vit_b32_onnx_via_tract   # operator-provisioned projection-head exports
    semantic_fallback: local metadata scorer with visible status line
    clip_models: [product/models/clip-vit-b32-visual.onnx, product/models/clip-vit-b32-textual.onnx]
    clip_vocab: product/assets/clip/bpe_simple_vocab_16e6.txt   # vendored, MIT
  labels:
    catalog: arbitrary stable IDs with unique case-insensitive names and unique canonical hex colors
    assignments: ordered deduplicated stable-ID vectors; legacy scalar values migrate transactionally
    tile_badges: bounded top-right lane with +N overflow
    delete: usage-aware explicit confirmation plus atomic catalog/assignment cleanup
    render_db_calls: forbidden
    render_db_calls_enforcement: MediaDb::transaction_count sampled around three settled frames by the ui-inspect preset media_render_txn_free; a non-zero delta fails the run
  controller:
    engine: winmm_direct_first_with_gilrs_wgi_for_unacquired_controllers
    probe: facial-cli controller-probe
    scope: media surface only; repaint 50ms cadence only while a pad is connected on the Media tab
    bindings: persisted via media_db settings (media_bindings_v1), remappable by capture in the settings panel
    couch_folders: Select/Back opens large in-app focus window; D-pad/stick navigate; A/Right enter; B/Left parent
    pointer_mode: Ctrl+M/R3 toggles; right stick moves; A/B left/right click; focus loss releases and disables
    app_switch: focus-gated rising-edge Start/Menu sends balanced Alt+Tab then releases pointer state; Guide-held input is suppressed
  config:
    media_thumb_cache_mb: 2048 default   # FACIAL_MEDIA_THUMB_CACHE_MB, floor 64
    clip_model_env: [FACIAL_CLIP_IMAGE_MODEL, FACIAL_CLIP_TEXT_MODEL]
    video_runtime_env: [FACIAL_FFMPEG, FACIAL_VLC_DIR, FACIAL_VLC_REMOTE_CACHE_MS, FACIAL_VLC_VOUT]
    media_front_defaults: {filter: all, recursive: true, thumbnail_edge: 500, show_names: false}
  interaction_contract:
    no_unsolicited_external_windows: true # explicit Open-file handoff via Windows association and Choose-app are the only media-player exceptions
    fullscreen: Ctrl+F/L3 native borderless; Esc restores; Ctrl+B favorites
    filesystem_roots: Windows GetLogicalDrives assigned-root list (including mapped network drives) shared by the compact strip, folder picker, and couch navigator; direct UNC location input supports unmapped NAS shares
    couch_folder_navigator: Folders button/Ctrl+G/Select opens a stable viewport-clamped 1800x1360 surface with a soft backdrop, a horizontal drive rail, and 52-point names/icons in 112-point virtual rows
    couch_folder_model_path: media_folder_navigate receipt intent drives staged open/move/enter/parent/close; commit scans the active tab; open_new_tab preserves the prior tab
    tab_shortcuts: {new: Ctrl+T, next: Ctrl+Tab, previous: Ctrl+Shift+Tab, close: Ctrl+W}
    per_tab_viewport: [kind, collection_view, collection_label_id, folder, selected_keys, cursor, query, search_folder_only, filter, sort, sort_descending, layout, library_scroll, staged_folder]
    tab_kinds: {folder: filesystem_scan, collection: metadata_cache_no_scan}   # WP-067
    collection_views: [fav_videos, fav_images, labels]                          # WP-067; label CRUD stays in Settings
    sort_keys: [name, modified, size, created]                                  # WP-068; per tab, asc/desc
    sort_unknown_stat: sorts_last_in_both_directions                            # WP-068
    sort_settlement: exact request generation + current stat sidecar + current display stats generation; display_provenance alone is insufficient
    sort_pending_notice: ordering by KEY current rows remain usable
    video_surface_clip: clipped_to_owning_panel_hidden_when_empty               # WP-065
    video_hide: live_visibility_checked_and_vacated_region_invalidated          # WP-065
    folder_change_playback: explicit_stop_when_media_leaves_folder              # WP-065
    modal_capture_window: navigator_accepts_commands_while_capturing            # WP-064
    modal_layering: window_claims_top_of_order_middle_above_its_own_veil        # WP-064; veil and Window share Order::Middle
    international_glyphs: optional_windows_system_faces_monochrome_emoji        # WP-070; ~57MB, opt out with FACIAL_SYSTEM_FONTS=0
    transport_slider_rail: explicit_visible_trough                              # WP-070; default trough was page-white on paper
    shared_state: [surrealdb_application_store, thumbnail_cache, single_libvlc_player]
    dividers: short painted handles with larger drag hit targets
    scrollbars: 24-point floating grab region; 64-point minimum handle; hidden at rest; fast hover/interaction reveal
  performance_contract:
    scan_batches: {first: 64, subsequent_max: 1024}
    last_good_inventory: surrealdb_transactional_generation_plus_bounded_runtime_tab_cache
    runtime_tab_cache: {tabs_max: 8, rows_max: 1000000, publish: immediate_on_activation, reconciliation_delay_ms: 750, reconcile: mandatory_bounded_deferred}
    incomplete_scan_deletes_inventory: false
    display_order: provisional_published_per_batch_then_settled   # WP-069; never blanked while cached rows exist
    load_timing_fields: [first_row_ms, first_thumbnail_visible_ms, scrollable_frame_ms, settled_order_ms]
    load_timing_identity: [tab_id, lane_id, scan_id]
    render_tile_key: cached_per_path_not_recomputed_per_frame     # WP-069
    search_sort_stat: off_thread_latest_only
    remote_io_limits: root_kind_specific
    staged_folder_root_budget: active_equal_or_descendant_reuses_resolved_physical_key; different_root_resolves_once_in_worker_before_enqueue
    mapped_identity_upgrade: promote_legacy_lexical_inventory_manifest_to_os_proven_unc_key_without_copying_item_rows
    # WP-069 layer order, highest priority first. Background exists so a
    # whole-folder sweep no visible row waits on cannot take permits ahead of
    # overscan thumbnails; before it, the stat sweep behind a size sort ran as
    # Metadata and starved the thumbnails that sort reorders.
    work_class_order: [Playback, Visible, Metadata, Scan, Prefetch, Background]
    background_class_members: [stat sweep behind size/date sort, semantic index query]
    metadata_class_status: reserved slot, currently no producers; per-row hydration is served from the in-memory cache
    background_starvation_floor: IoPolicy::priority_burst fairness turn; throttled, never starved, so a stat sort settles
    layer_order_test: media_io::tests::whole_folder_sweeps_yield_to_thumbnail_prefetch_but_still_get_a_turn
    playback_priority: background_throttle_with_hysteresis
    visible_thumbnail_capacity: reserved
    render_paths: visible plus overscan only
    render_filesystem_calls: forbidden
    stale_thumbnail_jobs: discard before decode
    video_thumbnails: dedicated visible + prefetch FFmpeg workers; visible 15s/prefetch 5s attempt caps; disk cached; memoized failure
    video_playback: one LibVLC player prewarms plugin state on a bounded startup worker and opens media only after explicit Play has a visible reconciled Viewer surface; Library tiles remain static and route Play to Viewer; play_library rejects with the failed exact-NAS gate reason; composition-safe wingdi default; optimistic controls reconcile through fresh status/error polling
    video_start_order: command queues Viewer preparing_surface -> render claims current clipped geometry -> child placed -> libvlc play
    video_surface_writer: single reconciler at the end of render_ui; Viewer records the reachable playback claim, no claim means hide; retained Library arbitration is defensive compatibility code and is not an accepted product route   # WP-058/WP-065
    video_surface_writer_guard: ui::tests::only_the_reconciler_moves_the_native_video_surface  # source-level; no child window exists headlessly
    shell_dialog_owner: eframe parent handle re-validated with IsWindow; GetActiveWindow only as last resort   # WP-060/WP-065
    startup_to_interactive_ms: {release_median: 4441, release_runs: [4441, 4163, 4731], debug_runs: [18261, 20725, 16978], note: upper bound; includes up to ~1000ms intent-poll cadence plus 100ms harness granularity}
    pending_video_selection: exact file waits up to 10s for asynchronous display-order publication before scroll/play
    playback_trace_env: FACIAL_PLAYBACK_TRACE
    current_large_folder_playback_scale: "146634 files on the exact Z: mapped folder; Viewer playback advanced during a complete Created sweep with zero stat failures; NAS-disruptive disconnect/restart testing remains operator-withheld"
    remote_vlc_cache_ms: optional 50..10000; no default without measurement
  inspector_presets: [media, media_grid, media_full, media_hidden, media_names, media_international_names, media_labels_multi, media_delete_confirm, media_delete_confirm_permanent, media_viewer_meta_high_font, media_select_batch, media_select_sheet, media_receiving_pane, media_settings, media_settings_controls, media_settings_constrained_high_font, media_settings_couch_1080p, media_settings_couch_4k, media_scrollbar, media_scrollbar_nested, media_video, media_sort_pending, media_tabs_multi, media_collection_remove_row, media_render_txn_free, media_search_subtractive, media_search_autocomplete, media_search_scope_tab, media_search_scope_folder, media_folders_couch, media_folders_long, media_folders_deep, media_folders_empty, media_folders_fullscreen, media_folders_opaque_backdrop]   # deterministic (both controller acquisition routes disabled in fixtures); see gui_inspector.enforcement_presets for the ones that fail the run

gui_theme_v2:
  workpacket: WP-048
  style: brutalist_flat_paper            # operator design language 2026-08-06
